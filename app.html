/* ============================================================
   PORTFOLIO MEDIA — photos and videos on Amazon S3
   The phone asks our "media" function for a one-time upload link,
   uploads the file straight to S3, then the server checks its real
   size against the photographer's storage plan before it shows.
   ============================================================ */
const isVideoUrl = u => /\.(mp4|mov|webm)(\?|$)/i.test(String(u || ""));
const fmtBytes = n => { n = Number(n) || 0; if(!n) return "0 MB"; return n >= 1024*1024*1024 ? (n / 1073741824).toFixed(n % 1073741824 ? 1 : 0) + " GB"
  : n >= 1024*1024 ? Math.round(n / 1048576) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB"; };
/* a thumbnail for a photo or a video (videos show their first frame and a play badge) */
function mediaThumb(u, cls){
  return isVideoUrl(u)
    ? `<span class="vthumb ${cls||""}"><video src="${esc(u)}#t=0.1" muted playsinline preload="metadata"></video><i class="play">${icon("play",16,"#fff")}</i></span>`
    : `<img class="${cls||""}" src="${esc(u)}" alt="" loading="lazy">`;
}
async function mediaFn(action, body){
  const { data, error } = await sb.functions.invoke("media", { body: Object.assign({ action }, body || {}) });
  if(error){ let m = error.message; try{ const j = await error.context.json(); if(j && j.error) m = j.error; }catch(e){} throw new Error(m); }
  return data;
}
async function loadStorage(){
  try{ const { data, error } = await sb.rpc("my_storage"); if(!error && data){ S.storage = data; } }catch(e){}
  return S.storage;
}
/* upload with progress (fetch can't report progress) */
function putWithProgress(url, headers, blob, onPct){
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open("PUT", url);
    Object.keys(headers || {}).forEach(k => x.setRequestHeader(k, headers[k]));
    x.upload.onprogress = e => { if(e.lengthComputable && onPct) onPct(Math.round(100 * e.loaded / e.total)); };
    x.onload = () => x.status >= 200 && x.status < 300 ? resolve() : reject(new Error("Upload failed (" + x.status + ")"));
    x.onerror = () => reject(new Error("Upload failed — check your connection"));
    x.send(blob);
  });
}
const VIDEO_TYPES = ["video/mp4", "video/quicktime", "video/webm"], MAX_VIDEO = 100 * 1024 * 1024;
async function uploadPortfolio(files){
  const list = Array.from(files || []).filter(f => /^image\//.test(f.type) || VIDEO_TYPES.includes(f.type));
  if(!list.length){ toast("Choose photos or videos", "Photos: JPG, PNG, WebP · Videos: MP4, MOV, WebM", "image"); return; }
  let added = 0, failed = 0, full = false;
  for(let i = 0; i < list.length; i++){
    const f = list[i], video = VIDEO_TYPES.includes(f.type), label = (video ? "video " : "photo ") + (i + 1) + " of " + list.length;
    try{
      if(video && f.size > MAX_VIDEO) throw new Error("Videos can be up to 100 MB each (" + f.name + " is " + fmtBytes(f.size) + ")");
      setBusyNote("Preparing " + label + "…");
      const blob = video ? f : await resizeImage(f);
      const type = video ? f.type : "image/jpeg";
      const slot = await mediaFn("sign", { type, bytes: blob.size });
      await putWithProgress(slot.upload_url, slot.headers, blob, pct => setBusyNote("Uploading " + label + " — " + pct + "%"));
      setBusyNote("Checking " + label + "…");
      await mediaFn("confirm", { key: slot.key });
      added++;
    }catch(e){
      failed++; console.warn("SnapPro upload", e);
      if(/space|upgrade|storage/i.test(e.message)){ full = true; toast("Out of storage", PLAY_APP ? "Your portfolio is full. Remove some items to make room." : e.message, "image"); break; }
      toast("Couldn't upload " + label, e.message, "x");
    }
  }
  setBusyNote("");
  await Promise.all([api.loadMe(), loadStorage()]).catch(() => {});
  if(added) toast(added === 1 ? "Added to your portfolio" : added + " items added", "They're on your public profile now", "image");
  if(full) push("storage");
  else render();
}
async function removePortfolio(url){
  if(!confirm("Remove this from your portfolio?")) return;
  try{
    await mediaFn("delete", { url });
    const marker = "/object/public/portfolio/", i = url.indexOf(marker);       // photos from before S3
    if(i >= 0){ try{ await sb.storage.from("portfolio").remove([decodeURIComponent(url.slice(i + marker.length))]); }catch(e){} }
    toast("Removed", "", "trash");
  }catch(e){ toast("Couldn't remove", e.message, "x"); }
  await Promise.all([api.loadMe(), loadStorage()]).catch(() => {});
  render();
}

/* ---------- storage meter + plans ---------- */

  const pctUsed = Math.min(100, Math.round(100 * st.used / Math.max(1, st.quota)));
  const plan = (st.plans || []).find(p => p.id === st.plan);

    ${PLAY_APP ? "" : `<button class="btn ${st.hidden || pctUsed >= 80 ? "primary" : ""} block mt12" onclick="push('storage')">${st.plan === "free" ? "Get more storage" : soon || st.hidden ? "Renew storage" : "Storage plans"}</button>`}

/* where this visit came from (campaign tags, the site that sent it, invite code, landing page).
   Kept in this browser; sent with the visit count and, once, with a new account. */
const TOUCH = (function(){ try{
  const q = new URLSearchParams(location.search), u = {}; let tagged = false;
  ["source","medium","campaign","term","content"].forEach(n => { const v = q.get("utm_" + n); if(v){ u[n] = v.slice(0, 120); tagged = true; } });
  let ref = null;
  try{ if(document.referrer){ const h = new URL(document.referrer).hostname; if(h && h !== location.hostname) ref = h.replace(/^www\./, ""); } }catch(e){}
  const code = q.get("ref"); if(code && /^SP[CP]\d{4,}$/i.test(code)) u.ref = code.toUpperCase();
  if(q.get("gclid") || q.get("fbclid") || q.get("msclkid")) u.ads_click = true;
  const t = { ...u, referrer: ref || undefined, landing: location.pathname, shoot: q.get("shoot") || undefined, at: new Date().toISOString() };
  if(!localStorage.getItem("snappro.ft")) localStorage.setItem("snappro.ft", JSON.stringify(t));
  if(tagged || ref || u.ref) localStorage.setItem("snappro.lt", JSON.stringify(t));
  return { utm: u, referrer: ref };
}catch(e){ return { utm: {}, referrer: null }; } })();
/* tell SnapPro how a new account found us — once per account */
async function sendSource(){
  try{
    if(!S.me || !sb) return;
    const key = "src_" + S.me.id; if(S.prefs[key] || S.srcSending) return;
    S.srcSending = true;
    const get = k => { try{ return JSON.parse(localStorage.getItem(k) || "null"); }catch(e){ return null; } };
    const ua = navigator.userAgent || "";
    const { error } = await sb.rpc("set_my_source", { p: { visitor: visitorId(), first: get("snappro.ft"), last: get("snappro.lt"),
      device: /iPad|Tablet/i.test(ua) ? "tablet" : /Mobi|Android|iPhone/i.test(ua) ? "mobile" : "desktop" } });
    S.srcSending = false;
    if(!error){ S.prefs[key] = 1; savePrefs(); }
  }catch(e){ S.srcSending = false; }
}

(function(){ try{ const r = new URLSearchParams(location.search).get("ref");

(function(){ try{

  if(q.has("shoot") || q.has("src")){ q.delete("shoot"); q.delete("src");

/* plain-English description of a reward */
function rewardLine(b){
  const a = Number(b.amount);
  switch(b.kind){
    case "booking_flat": return inr(a) + " off a booking" + (b.min_booking ? " of " + inr(b.min_booking) + "+" : "");
    case "booking_pct": return a + "% off a booking" + (b.max_amount ? " (up to " + inr(b.max_amount) + ")" : "");
    case "storage_bonus": return a + " GB extra portfolio storage";
    case "commission_cut": return a + "% commission" + (b.uses || b.uses_left ? " on your next " + (b.uses_left || b.uses) + " booking" + ((b.uses_left || b.uses) == 1 ? "" : "s") : "");

    case "storage_discount": return a + "% off a storage plan";
  }
  return b.title || "";
}

/* best booking reward a customer has (preview only — the server applies the real one) */
function bestDiscountFor(price){
  const list = ((S.rewards && S.rewards.benefits) || []).filter(b => (b.kind === "booking_flat" || b.kind === "booking_pct") && (!b.min_booking || price >= b.min_booking));
  let best = null, amt = 0;
  list.forEach(b => { const d = b.kind === "booking_flat" ? Math.round(b.amount) : Math.min(Math.round(price * b.amount / 100), b.max_amount ? Math.round(b.max_amount) : 1e9);
                      if(d > amt){ amt = d; best = b; } });
  const cap = Math.round(price * S.commission / 100);
  return best ? { amount: Math.min(amt, cap, advFor(price) - 1), title: best.title } : null;
}
function storageDiscountPct(){
  const b = ((S.rewards && S.rewards.benefits) || []).filter(x => x.kind === "storage_discount").sort((a, b) => b.amount - a.amount)[0];
  return b ? Number(b.amount) : 0;
}

const ID_TYPES = [

/* ---------- the verification screen ---------- */

    ${t ? `<div class="sec-title mt20">2. Photos of your ${esc(t[1])}</div>

async function submitKyc(){
  const d = S.kycDraft, t = idType(d.type);
  const last4 = (d.last4 || "").trim();
  if(last4 && !/^[A-Z0-9]{4}$/.test(last4)){ S.formErr = "The last 4 characters should be letters or numbers."; render(); return; }
  S.loading.kyc = true; S.formErr = null; render();
  try{
    const stamp = Date.now(), up = async (key) => {
      if(!d[key]) return null;
      const path = S.me.id + "/" + d.type + "-" + key + "-" + stamp + ".jpg";
      const r = await sb.storage.from("kyc").upload(path, d[key].blob, { contentType: "image/jpeg", upsert: false });
      if(r.error) throw r.error;
      return path;
    };
    const front = await up("front"), back = t[3] ? await up("back") : null, face = await up("face");
    const { error } = await sb.rpc("submit_kyc", { p_type: d.type, p_last4: last4 || null, p_front: front, p_back: back, p_selfie: face });
    if(error) throw error;
    S.kycDraft = null; S.loading.kyc = false; await loadKyc();
    toast("ID submitted", "We'll let you know once it's checked", "check"); render();
  }catch(e){ S.loading.kyc = false; S.formErr = e.message || "Upload failed — please try again."; render(); }
}

/* ---------- camera with guides (card frame / face oval) ---------- */
let camStream = null, camTimer = null;
function camLayer(){ let n = el("camLayer"); if(!n){ n = document.createElement("div"); n.id = "camLayer"; document.body.appendChild(n); } return n; }
function closeCapture(){
  if(camTimer){ clearInterval(camTimer); clearTimeout(camTimer); camTimer = null; }
  if(camStream){ camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  const n = el("camLayer"); if(n) n.innerHTML = "";
}
async function openCapture(key, mode){
  const face = mode === "face";
  const L = camLayer();
  const guide = face
    ? `<div class="cam-guide oval"><i id="ovRing" class="ov-ring"></i></div>`
    : `<div class="cam-guide cardf"><b class="c1"></b><b class="c2"></b><b class="c3"></b><b class="c4"></b></div>`;
  L.innerHTML = `<div class="cam ${face ? "face" : "card"}">
    <video id="camV" autoplay playsinline muted ${face ? 'class="mirror"' : ""}></video>${guide}
    <div class="cam-top"><button class="iconbtn cam-x" aria-label="Close" onclick="closeCapture()">${icon("x",20,"#fff")}</button>
      <div class="cam-title">${face ? "Face photo" : key === "back" ? "Back of your ID" : "Front of your ID"}</div></div>
    <div class="cam-tip" id="camTip">${face ? "Fit your face inside the oval" : "Place the card inside the frame — make sure all text is sharp and readable"}</div>
    <div class="cam-bottom"><button class="shutter" id="camShoot" aria-label="Capture" onclick="${face ? "faceCountdown('" + key + "')" : "snap('" + key + "','card')"}"><i></i></button>
      <div class="xs cam-sub">${face ? "Good light · no cap or sunglasses · look straight" : "No glare · flat surface · all four corners visible"}</div></div>
    <label class="cam-alt">Camera not working? <span>Choose a photo instead</span>
      <input type="file" accept="image/*" ${face ? 'capture="user"' : 'capture="environment"'} onchange="pickedFile('${key}', this.files[0])"></label>
  </div>`;
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("no camera");
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: face ? "user" : { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    const v = el("camV"); if(!v){ closeCapture(); return; }
    v.srcObject = camStream; try{ await v.play(); }catch(e){}
    if(face) watchFace(key);
  }catch(e){
    const tip = el("camTip"); if(tip) tip.textContent = "We couldn't open the camera. Allow camera access in your browser, or choose a photo below.";
    const b = el("camShoot"); if(b) b.disabled = true;
  }
}
/* if the browser can find faces, capture automatically once the face sits inside the oval */
function watchFace(key){
  if(!("FaceDetector" in window)) return;
  let fd; try{ fd = new window.FaceDetector({ fastMode: true, maxDetectedFaces: 1 }); }catch(e){ return; }
  let good = 0;
  camTimer = setInterval(async () => {
    const v = el("camV"); if(!v || !v.videoWidth) return;
    try{
      const f = (await fd.detect(v))[0], ring = el("ovRing"), tip = el("camTip");
      if(!f){ good = 0; if(ring) ring.classList.remove("ok"); if(tip) tip.textContent = "Fit your face inside the oval"; return; }
      const b = f.boundingBox, cx = (b.x + b.width / 2) / v.videoWidth, cy = (b.y + b.height / 2) / v.videoHeight, w = b.width / v.videoWidth;
      const ok = Math.abs(cx - .5) < .12 && Math.abs(cy - .45) < .15 && w > .28 && w < .75;
      if(tip) tip.textContent = !ok ? (w <= .28 ? "Move a little closer" : w >= .75 ? "Move back a little" : "Centre your face in the oval") : "Hold still…";
      if(ring) ring.classList.toggle("ok", ok);
      good = ok ? good + 1 : 0;
      if(good >= 4){ clearInterval(camTimer); camTimer = null; snap(key, "face"); }
    }catch(e){}
  }, 350);
}
function faceCountdown(key){
  const tip = el("camTip"), ring = el("ovRing"), btn = el("camShoot");
  if(btn) btn.disabled = true;
  let n = 3; if(tip) tip.textContent = "Hold still — " + n;
  if(ring) ring.classList.add("ok");
  camTimer = setInterval(() => { n--; if(n > 0){ if(tip) tip.textContent = "Hold still — " + n; } else { clearInterval(camTimer); camTimer = null; snap(key, "face"); } }, 800);
}
function snap(key, mode){
  const v = el("camV"); if(!v || !v.videoWidth) return;
  const W = v.videoWidth, H = v.videoHeight, c = document.createElement("canvas");
  // crop to the guide: card = wide rectangle in the middle, face = portrait area around the oval
  let sx, sy, sw, sh;
  if(mode === "card"){ sw = W * .9; sh = sw * 54 / 86; if(sh > H * .9){ sh = H * .9; sw = sh * 86 / 54; } sx = (W - sw) / 2; sy = (H - sh) / 2; }
  else { sh = H * .95; sw = Math.min(W, sh * .78); sx = (W - sw) / 2; sy = (H - sh) / 2; }
  const k = Math.min(1, 1400 / Math.max(sw, sh));
  c.width = Math.round(sw * k); c.height = Math.round(sh * k);
  const g = c.getContext("2d");
  g.drawImage(v, sx, sy, sw, sh, 0, 0, c.width, c.height);
  const L = camLayer().querySelector(".cam"); if(L) L.classList.add("flash");
  c.toBlob(b => { if(b) acceptShot(key, b); }, "image/jpeg", .9);
}
async function pickedFile(key, f){
  if(!f) return;
  try{ const b = await resizeImage(f, 1400, .9); acceptShot(key, b); }catch(e){ toast("Couldn't read that photo", "Try another one", "x"); }
}
function acceptShot(key, blob){
  closeCapture();
  const d = S.kycDraft || (S.kycDraft = {});
  if(d[key] && d[key].url) URL.revokeObjectURL(d[key].url);
  d[key] = { blob, url: URL.createObjectURL(blob) };
  toast(key === "face" ? "Face photo captured" : "ID photo captured", "Check it's sharp — retake if not", "check");
  render();
}

/* ============================================================
   IN-APP VOICE CALLS (over Wi-Fi / mobile data)
   Peer-to-peer audio with WebRTC. The two phones find each other
   through Supabase Realtime: a private channel only the customer and
   photographer on the booking can join, plus a backup channel named
   after the booking's secret call code (in case private channels are
   unavailable). Every signal goes on both; repeats are ignored.
   Works while SnapPro is open on both phones; when it's closed, the
   other phone gets a "… is calling" notification.
   ============================================================ */
const CALLABLE = ["confirmed","enroute","arrived","shooting","completed"];
const callChans = {};                 // call_token -> { priv, pub } channels
const seenSig = new Set();            // signals already handled (each one arrives on both channels)
let CALL = null;                      // the current call
let callTone = null;                  // stops the ringtone / ring-back / hold beep that's playing
const canCall = b => b && b.call_token && CALLABLE.includes(b.status) && !blockedOn(b) && !(b.status === "completed" && Date.now() - toMs(b.updated_at || b.start_at) > 7 * 864e5);

/* join (or leave) the call channel of every booking we can call on */
function syncCallChannels(){
  if(!sb || !sb.channel || !S.me) return;
  const want = new Set(S.d.bookings.filter(canCall).map(b => b.call_token));
  Object.keys(callChans).forEach(t => { if(!want.has(t)) leaveCallChannel(t); });
  want.forEach(t => { if(!callChans[t]) joinCallChannel(t); });
}
function leaveCallChannel(t){
  const c = callChans[t]; if(!c) return;
  [c.priv, c.pub].forEach(ch => { if(ch) try{ sb && sb.removeChannel(ch); }catch(e){} });
  delete callChans[t];
}
/* log out / delete account: stop listening for calls on this phone */
function leaveCallChannels(){
  if(CALL) endCall(true, "ended");
  Object.keys(callChans).forEach(leaveCallChannel);
}
function joinCallChannel(token){
  const c = callChans[token] = { priv: null, pub: null };
  const open = (name, priv) => {
    const ch = sb.channel(name, { config: { private: priv, broadcast: { self: false } } });
    ch.on("broadcast", { event: "sig" }, m => onSignal(token, m.payload || {}));
    ch.subscribe(st => { if(priv && (st === "CHANNEL_ERROR" || st === "TIMED_OUT") && callChans[token] === c){ try{ sb.removeChannel(ch); }catch(e){} c.priv = null; } });
    return ch;
  };
  c.priv = open("call:" + token, true);
  c.pub = open("callp:" + token, false);
  if(sb.realtime && sb.realtime.setAuth){ sb.auth.getSession().then(r => { const t = r && r.data && r.data.session && r.data.session.access_token; if(t) sb.realtime.setAuth(t); }).catch(() => {}); }
}
function sig(token, payload){
  const c = callChans[token]; if(!c || !S.me) return;
  const msg = { type: "broadcast", event: "sig", payload: Object.assign({ from: S.me.id, cid: CALL && CALL.cid, mid: Math.random().toString(36).slice(2) }, payload) };
  [c.priv, c.pub].forEach(ch => { if(ch) try{ Promise.resolve(ch.send(msg)).catch(() => {}); }catch(e){} });
}
/* phones only play sound after the person has touched the page once — wake the sound up on the first tap */
["pointerdown", "touchstart", "keydown"].forEach(ev => document.addEventListener(ev, () => { try{ toneAC(); }catch(e){} }, { once: true, passive: true }));
async function iceServers(){
  try{ const { data } = await sb.rpc("call_config"); if(Array.isArray(data) && data.length) return data; }catch(e){}
  return [{ urls: ["stun:stun.l.google.com:19302"] }];
}
function otherName(b){ return isPg() ? (b.customer_name || "Customer") : (b.photographer_name || "Photographer"); }

/* ---------- placing a call ---------- */
async function startCall(bookingId){
  const b = S.d.bookings.find(x => x.id === bookingId);
  if(!b || !canCall(b)){ toast("Calls open once the booking is confirmed", "", "x"); return; }
  if(CALL){ toast("You're already on a call", "", "x"); return; }
  if(!window.RTCPeerConnection || !navigator.mediaDevices){ toast("Calling isn't supported in this browser", "Try Chrome or Safari", "x"); return; }
  syncCallChannels();
  CALL = { cid: Math.random().toString(36).slice(2), token: b.call_token, booking: b.id, name: otherName(b), role: "caller", state: "calling", muted: false, held: false, speaker: false, at: Date.now() };
  paintCall();
  try{ await openCallAudio(); }
  catch(e){ toast("Microphone blocked", "Allow microphone access to call", "x"); endCall(false, "mic"); return; }
  if(!CALL || CALL.state !== "calling") return;
  playTone("ringback"); paintCall();
  Promise.resolve(sb.rpc("call_notify", { p_booking: b.id })).catch(() => {});   // rings their phone even if SnapPro is closed
  const ring = () => { if(CALL && CALL.state === "calling") sig(CALL.token, { t: "ring", name: S.me.name || "" }); };
  ring(); CALL.ringTimer = setInterval(ring, 2500);
  CALL.giveUp = setTimeout(() => { if(CALL && CALL.state === "calling"){ toast("No answer", CALL.name + " didn't pick up", "x"); endCall(true, "missed"); } }, 40000);
}
/* ---------- receiving ---------- */
async function onSignal(token, p){
  if(!p || !S.me || p.from === S.me.id) return;
  if(p.mid){ if(seenSig.has(p.mid)) return; seenSig.add(p.mid); if(seenSig.size > 500) seenSig.clear(); }
  if(p.t === "ring"){
    if(CALL && CALL.cid !== p.cid && (CALL.state === "incoming" || CALL.state === "calling") && Date.now() - (CALL.at || 0) > 60000) endCall(false, "stale");   // a call that never finished properly
    if(CALL && CALL.cid !== p.cid){ sig(token, { t: "busy", cid: p.cid }); return; }
    if(CALL) return;
    const b = S.d.bookings.find(x => x.call_token === token);
    CALL = { cid: p.cid, token, booking: b && b.id, name: (b && otherName(b)) || p.name || "SnapPro call", role: "callee", state: "incoming", muted: false, held: false, speaker: false, at: Date.now() };
    playTone("ring"); paintCall();
    CALL.giveUp = setTimeout(() => { if(CALL && CALL.state === "incoming"){ endCall(false, "missed"); toast("Missed call", "", "x"); } }, 45000);
    return;
  }
  if(!CALL || p.cid !== CALL.cid) return;
  if(p.t === "accept" && CALL.role === "caller" && CALL.state === "calling"){
    clearInterval(CALL.ringTimer); stopTone(); CALL.state = "connecting"; paintCall();
    const pc = await makePeer();
    const offer = await pc.createOffer(); await pc.setLocalDescription(offer);
    sig(CALL.token, { t: "sdp", sdp: pc.localDescription });
  } else if(p.t === "sdp" && p.sdp){
    const pc = CALL.pc || await makePeer();
    await pc.setRemoteDescription(p.sdp);
    (CALL.pendingIce || []).forEach(c => pc.addIceCandidate(c).catch(() => {})); CALL.pendingIce = [];
    if(p.sdp.type === "offer"){ const ans = await pc.createAnswer(); await pc.setLocalDescription(ans); sig(CALL.token, { t: "sdp", sdp: pc.localDescription }); }
  } else if(p.t === "ice" && p.c){
    if(CALL.pc && CALL.pc.remoteDescription) CALL.pc.addIceCandidate(p.c).catch(() => {});
    else (CALL.pendingIce = CALL.pendingIce || []).push(p.c);
  } else if(p.t === "decline"){ toast("Call declined", CALL.name + " can't talk right now", "x"); endCall(true, "declined", true); }
  else if(p.t === "busy"){ toast(CALL.name + " is on another call", "", "x"); endCall(true, "busy", true); }
  else if(p.t === "hangup"){ endCall(false, "ended", true); }
  else if(p.t === "hold"){ CALL.remoteHeld = !!p.on; if(CALL.remoteHeld && !CALL.held) playTone("hold"); else if(!CALL.held) stopTone(); applyCallAudio(); paintCall(); }
}
async function acceptCall(){
  if(!CALL || CALL.state !== "incoming") return;
  stopTone();
  try{ await openCallAudio(); }
  catch(e){ toast("Microphone blocked", "Allow microphone access to answer", "x"); declineCall(); return; }
  if(!CALL) return;
  clearTimeout(CALL.giveUp);
  CALL.state = "connecting"; paintCall();
  await makePeer();
  sig(CALL.token, { t: "accept" });
}
function declineCall(){ if(!CALL) return; sig(CALL.token, { t: "decline" }); endCall(false, "declined", true); }
async function makePeer(){
  const pc = new RTCPeerConnection({ iceServers: await iceServers() });
  CALL.pc = pc;
  (CALL.stream ? CALL.stream.getTracks() : []).forEach(t => pc.addTrack(t, CALL.stream));
  pc.onicecandidate = e => { if(e.candidate && CALL) sig(CALL.token, { t: "ice", c: e.candidate }); };
  pc.ontrack = e => { const a = el("callAudio"); if(a){ a.srcObject = e.streams[0]; a.play && a.play().catch(() => {}); } };
  pc.onconnectionstatechange = () => {
    if(!CALL) return;
    if(pc.connectionState === "connected" && CALL.state !== "live"){ CALL.state = "live"; CALL.startAt = Date.now(); clearTimeout(CALL.giveUp); CALL.tick = setInterval(paintCallTime, 1000); paintCall(); }
    if(pc.connectionState === "failed"){ toast("Call couldn't connect", "The network blocked it — try again on Wi-Fi", "x"); endCall(true, "failed"); }
  };
  return pc;
}
function hangUp(){ if(CALL) endCall(true, CALL.state === "live" ? "ended" : "cancelled"); }
function toggleMute(){
  if(!CALL || !CALL.stream) return;
  CALL.muted = !CALL.muted; applyCallAudio(); paintCall();
}
/* hold: neither side hears the other; the other phone shows "on hold" and hears a soft beep */
function toggleHold(){
  if(!CALL || CALL.state !== "live") return;
  CALL.held = !CALL.held; applyCallAudio();
  sig(CALL.token, { t: "hold", on: CALL.held });
  if(CALL.held || CALL.remoteHeld) playTone("hold"); else stopTone();
  paintCall();
}
/* mic on/off and whether we play the other person's voice */
function applyCallAudio(){
  if(!CALL) return;
  (CALL.stream ? CALL.stream.getAudioTracks() : []).forEach(t => t.enabled = !(CALL.muted || CALL.held));
  const a = el("callAudio"); if(a) a.muted = !!(CALL.held || CALL.remoteHeld);
}

/* ---------- earpiece or speaker ----------
   Chrome on Android lists the phone's call outputs as microphones named
   "Headset earpiece", "Speakerphone", "Wired headset" and "Bluetooth headset".
   Opening the microphone through one of them sends the call's sound there
   too — so a call starts on the earpiece, like a normal phone call. */
const MIC = { echoCancellation: true, noiseSuppression: true, autoGainControl: true };
const openMic = id => navigator.mediaDevices.getUserMedia({ audio: id ? Object.assign({ deviceId: { exact: id } }, MIC) : MIC, video: false });
async function callRoutes(){
  try{
    const list = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "audioinput");
    const find = re => (list.find(d => re.test(d.label || "")) || {}).deviceId || null;
    return { speaker: find(/speakerphone/i), earpiece: find(/earpiece/i), headset: find(/bluetooth|wired|usb/i) };
  }catch(e){ return {}; }
}
async function openCallAudio(){
  CALL.stream = await openMic(null);                     // asks for the microphone first (names appear after that)
  const R = CALL.routes = await callRoutes();
  CALL.canSpeaker = !!(R.speaker && (R.earpiece || R.headset));
  const quiet = R.headset || R.earpiece;
  if(quiet){ try{ await switchMic(quiet); }catch(e){} }
  CALL.speaker = false;
}
async function switchMic(id){
  const c = CALL; if(!c) return;
  const ns = await openMic(id);
  if(CALL !== c){ ns.getTracks().forEach(t => t.stop()); return; }
  const old = c.stream, track = ns.getAudioTracks()[0];
  c.stream = ns; applyCallAudio();
  const snd = c.pc && c.pc.getSenders ? c.pc.getSenders().find(x => x.track && x.track.kind === "audio") : null;
  if(snd && track) await snd.replaceTrack(track);
  if(old && old !== ns) old.getTracks().forEach(t => t.stop());
}
async function toggleSpeaker(){
  if(!CALL || !CALL.stream) return;
  if(!CALL.canSpeaker){ toast("Speaker isn't available here", "Your device chooses where call sound plays", "x"); return; }
  const R = CALL.routes, on = !CALL.speaker;
  try{ await switchMic(on ? R.speaker : (R.headset || R.earpiece)); if(CALL){ CALL.speaker = on; paintCall(); } }
  catch(e){ toast("Couldn't switch the speaker", "", "x"); }
}
/* tidy up, tell the other phone, and note the call in the chat (caller writes it) */
function endCall(notify, why, remote){
  const c = CALL; if(!c) return;
  CALL = null;
  if(notify && !remote) sig(c.token, { t: "hangup", cid: c.cid });
  clearInterval(c.ringTimer); clearTimeout(c.giveUp); clearInterval(c.tick); stopTone();
  try{ c.pc && c.pc.close(); }catch(e){}
  (c.stream ? c.stream.getTracks() : []).forEach(t => t.stop());
  const secs = c.startAt ? Math.round((Date.now() - c.startAt) / 1000) : 0;
  if(c.role === "caller" && c.booking && why !== "mic"){
    const txt = secs ? "📞 Voice call · " + Math.floor(secs / 60) + ":" + String(secs % 60).padStart(2, "0") : "📞 Missed voice call";
    api.sendMessage(c.booking, txt).then(() => loadChat(c.booking)).catch(() => {});
  }
  paintCall();
}

/* ---------- call screen ---------- */
function callLayer(){ let n = el("callLayer"); if(!n){ n = document.createElement("div"); n.id = "callLayer"; document.body.appendChild(n); } return n; }
function callTime(){ if(!CALL || !CALL.startAt) return ""; const s = Math.round((Date.now() - CALL.startAt) / 1000); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function liveStatus(){ return CALL.held ? "On hold · " + callTime() : CALL.remoteHeld ? CALL.name.split(" ")[0] + " put you on hold" : callTime(); }
function paintCallTime(){ const n = el("callStatus"); if(n && CALL && CALL.state === "live") n.textContent = liveStatus(); }
function paintCall(){
  const L = callLayer();
  if(!CALL){ L.innerHTML = ""; return; }
  const st = { calling: "Ringing…", incoming: "Incoming voice call", connecting: "Connecting…", live: liveStatus() }[CALL.state] || "";
  const btn = (fn, ic, label, on, dis) => `<button class="cbtn ${on ? "on" : ""}" ${dis ? "disabled" : ""} onclick="${fn}" aria-label="${label}" aria-pressed="${!!on}">${icon(ic,24,"#fff")}<span>${label}</span></button>`;
  L.innerHTML = `<div class="callscr ${CALL.state}">
    <div class="call-who"><div class="call-av">${avatarHtml(CALL.booking || CALL.name, CALL.name, "av-96")}<i class="pulse"></i></div>
      <div class="call-name">${esc(CALL.name)}</div><div class="call-st" id="callStatus">${st}</div>
      <div class="xs call-net">${icon("shield",12,"rgba(255,255,255,.7)")} SnapPro call over the internet</div></div>
    <audio id="callAudio" autoplay playsinline></audio>

      ${CALL.state === "incoming"
        ? `<button class="cbtn red" onclick="declineCall()" aria-label="Decline">${icon("phone",26,"#fff")}<span>Decline</span></button>
           <button class="cbtn green" onclick="acceptCall()" aria-label="Accept">${icon("phone",26,"#fff")}<span>Accept</span></button>`
        : `<div class="call-ctl">${btn("toggleMute()", CALL.muted ? "micoff" : "mic", CALL.muted ? "Unmute" : "Mute", CALL.muted)}
             ${btn("toggleSpeaker()", "speaker", "Speaker", CALL.speaker, !CALL.stream)}
             ${btn("toggleHold()", "pause", CALL.held ? "Resume" : "Hold", CALL.held, CALL.state !== "live")}</div>
           <button class="cbtn red" onclick="hangUp()" aria-label="End call">${icon("phone",26,"#fff")}<span>${CALL.state === "live" ? "End" : "Cancel"}</span></button>`}
    </div></div>`;
  if(CALL.pc){ const a = el("callAudio"); const r = CALL.pc.getReceivers ? CALL.pc.getReceivers() : []; if(a && r.length && r[0].track){ try{ a.srcObject = new MediaStream(r.map(x => x.track)); }catch(e){} } }
  applyCallAudio();
}
/* ---------- sounds, made in the browser (no sound files) ----------
   ring:     a soft marimba phrase for an incoming call (with vibration)
   ringback: the familiar Indian "tring-tring" the caller hears while it rings
   hold:     a gentle double beep every few seconds while a call is on hold */
let toneCtx = null;
function toneAC(){
  const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return null;
  if(!toneCtx || toneCtx.state === "closed") toneCtx = new AC();
  if(toneCtx.state === "suspended") toneCtx.resume().catch(() => {});
  return toneCtx;
}
function tone(ctx, f, t, dur, vol, attack){
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = "sine"; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t);
  if(attack){ g.gain.linearRampToValueAtTime(vol, t + attack); g.gain.setValueAtTime(vol, t + dur - 0.03); g.gain.linearRampToValueAtTime(0.0001, t + dur); }
  else { g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); }
  o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + dur + 0.05);
}
const marimba = (ctx, f, t, v) => { tone(ctx, f, t, 0.9, v); tone(ctx, f * 2, t, 0.35, v * 0.2); tone(ctx, f * 4, t, 0.12, v * 0.12); };
const TONES = {
  ring:     { every: 2800, play: (ctx, t) => { [[0, 659.25], [0.15, 830.61], [0.3, 987.77], [0.45, 1318.51], [0.85, 987.77], [1.0, 1318.51]].forEach(([d, f]) => marimba(ctx, f, t + d, 0.2));
                                                if(navigator.vibrate) navigator.vibrate([450, 250, 450]); } },
  ringback: { every: 3000, play: (ctx, t) => { [0, 0.6].forEach(d => { tone(ctx, 400, t + d, 0.4, 0.06, 0.02); tone(ctx, 450, t + d, 0.4, 0.05, 0.02); }); } },
  hold:     { every: 4000, play: (ctx, t) => { [0, 0.25].forEach(d => tone(ctx, 523.25, t + d, 0.16, 0.05, 0.01)); } }
};
function playTone(kind){
  stopTone();
  try{
    const T = TONES[kind], ctx = toneAC(); if(!T || !ctx) return;
    let on = true; const run = () => { if(on) T.play(ctx, ctx.currentTime + 0.05); };
    run(); const iv = setInterval(run, T.every);
    callTone = () => { on = false; clearInterval(iv); if(navigator.vibrate) navigator.vibrate(0); };
  }catch(e){}
}
function stopTone(){ if(callTone){ callTone(); callTone = null; } }

function navMark(root){

/* ============================================================
   PHONE NOTIFICATIONS — quotes, bookings, messages, calls and new
   requests reach the phone even when SnapPro is closed.
   The phone's push address is saved with push_subscribe(); the
   server sends through the "push" Edge Function; sw.js shows them.
   Tapping one opens app.html?open=…&id=… (handled by openTarget).
   ============================================================ */
const pushOK = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window && location.protocol === "https:";
let PUSH_KEY;                                      // VAPID public key (undefined = not loaded, null = not set up)
async function pushKey(){
  if(PUSH_KEY !== undefined) return PUSH_KEY;
  try{ const { data } = await sb.from("platform_settings").select("value").eq("key", "push_public_key").maybeSingle(); PUSH_KEY = (data && data.value) || null; }
  catch(e){ PUSH_KEY = null; }
  return PUSH_KEY;
}
function keyBytes(s){ s = String(s).replace(/-/g, "+").replace(/_/g, "/"); while(s.length % 4) s += "="; const b = atob(s), u = new Uint8Array(b.length); for(let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
const keyText = buf => btoa(String.fromCharCode.apply(null, new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const pushDevice = () => { const ua = navigator.userAgent || ""; return (PLAY_APP ? "Android app" : /Android/i.test(ua) ? "Android" : /iPhone|iPad/i.test(ua) ? "iPhone" : "Computer") + " · " + (/Edg\//.test(ua) ? "Edge" : /Chrome/.test(ua) ? "Chrome" : /Firefox/.test(ua) ? "Firefox" : /Safari/.test(ua) ? "Safari" : "Browser"); };
const pushPerm = () => pushOK() ? Notification.permission : "unsupported";

/* ask = true when the person tapped "Turn on"; false = quietly keep an existing permission in sync */
async function pushSubscribe(ask){
  if(!pushOK() || !S.me || !sb) return false;
  const key = await pushKey(); if(!key) return false;
  if(Notification.permission === "denied") return false;
  if(Notification.permission !== "granted"){
    if(!ask) return false;
    const p = await Notification.requestPermission();
    if(p !== "granted"){ render(); return false; }
  }
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if(sub && sub.options && sub.options.applicationServerKey && keyText(sub.options.applicationServerKey) !== key){ try{ await sub.unsubscribe(); }catch(e){} sub = null; }
  if(!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(key) });
  const j = sub.toJSON();
  const { error } = await sb.rpc("push_subscribe", { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth, p_device: pushDevice() });
  if(error) throw new Error(dbMsg(error));
  S.pushFor = S.me.id;
  return true;
}
async function enablePush(){
  try{
    if(pushPerm() === "denied"){ toast("Notifications are blocked", "Allow them for SnapPro in your phone's Settings → Apps → SnapPro → Notifications", "x"); return; }
    if(await pushSubscribe(true)){ toast("Notifications are on", "We'll let you know about quotes, bookings, messages and calls", "bellring"); }
    else if(pushPerm() !== "granted") toast("Notifications are off", "You can turn them on any time in Profile", "x");
  }catch(e){ toast("Couldn't turn on notifications", e.message, "x"); }
  render();
}
/* this phone stops getting this account's notifications (log out) */
async function pushForget(){
  try{ if(!pushOK()) return; const reg = await navigator.serviceWorker.getRegistration(); const sub = reg && await reg.pushManager.getSubscription();
       if(sub && sb) await sb.rpc("push_unsubscribe", { p_endpoint: sub.endpoint }); }catch(e){}
  S.pushFor = null;
}
/* once per session: keep this phone's subscription saved for whoever is signed in */
function pushSync(){
  if(!S.me || S.pushFor === S.me.id || S.pushSyncing || !pushOK()) return;
  S.pushSyncing = true;
  pushKey().then(k => k && Notification.permission === "granted" ? pushSubscribe(false) : null).catch(() => {}).then(() => { S.pushSyncing = false; softRender(); });
}
/* the to-do card that offers notifications */
function pushTodo(out){
  if(!pushOK() || !PUSH_KEY || Notification.permission === "denied" || S.pushFor === (S.me && S.me.id) || S.pushSyncing) return;
  out.push({ key: "push", ic: "bellring", tone: "accent", urgent: false, title: "Turn on notifications",
    sub: isPg() ? "Hear about new shoots near you, bookings, messages and calls — even when SnapPro is closed" : "Know the moment you get a quote, a message or a call — even when SnapPro is closed",
    btn: "Turn on", go: "enablePush()" });
}
function pushRow(){
  if(!pushOK()) return "";
  const p = pushPerm(), on = p === "granted" && S.pushFor === (S.me && S.me.id);
  return `<button class="li" onclick="${on ? "testPush()" : "enablePush()"}">${icon("bellring",18,on ? "var(--green)" : "var(--muted)")}
    <div class="grow"><div class="sm bold">Notifications</div><div class="xs muted2">${on ? "On for this phone · tap to send a test" : p === "denied" ? "Blocked — allow them in your phone's Settings" : !PUSH_KEY ? "Coming soon" : "Off — tap to turn on"}</div></div>${icon("chevron",16,"var(--muted-2)")}</button>`;
}
/* sends a notification to this account's phones, to check everything works */
async function testPush(){
  try{
    if(S.pushFor !== (S.me && S.me.id)) await pushSubscribe(true);
    const { data, error } = await sb.rpc("push_test");
    if(error) throw new Error(dbMsg(error));
    if(!data || !data.phones){ toast("Notifications aren't on yet", "Tap Notifications to turn them on", "x"); return; }
    toast("Test sent", "Close SnapPro now — a notification should arrive within a few seconds", "bellring");
  }catch(e){ toast("Couldn't send a test", e.message, "x"); }
}

/* ---------- opening the right screen from a notification ---------- */
function openTarget(t){
  if(!t || !S.me) return;
  const id = t.id;
  S.stack = [];
  if(t.open === "request" && id && isCustomer()) push("request", { id });
  else if(t.open === "quote" && id && isPg()) push("quote", { id });
  else if(t.open === "booking" && id) push(isPg() ? "job" : "booking", { id });
  else if(t.open === "chat" && id) push("chat", { id });
  else if(t.open === "reviews" && isPg()) push("pgReviews");
  else render();
}
function openTargetFromUrl(u){
  try{ const q = new URL(u, location.href).searchParams, open = q.get("open"), id = q.get("id");
       if(open && /^[a-z]{3,10}$/.test(open)) return { open, id: id && /^[0-9a-f-]{36}$/i.test(id) ? id : null }; }catch(e){}
  return null;
}
if("serviceWorker" in navigator){
  navigator.serviceWorker.addEventListener("message", ev => {
    const d = ev.data || {};
    if(d.type === "snappro-open"){ const t = openTargetFromUrl(d.url); if(t && S.me) refresh(false).then(() => openTarget(t)); }
  });
}

/* ============================================================
   NAVIGATION
   ============================================================ */
const AUTH_VIEWS = { welcome: vWelcome, signup: vSignup, otp: vOtp, login: vLogin, reset: vReset, newpw: vNewPw,
                     setupRole: vSetupRole, setupCust: vSetupCust, setupPg: vSetupPg };
const STACK_VIEWS = { pg: vPgProfile, photo: vPhoto, newRequest: vNewRequest, request: vRequest, confirm: vConfirm,
                      booking: vBooking, rate: vRate, chat: vChat, editName: vEditName, editLoc: vEditLoc,
                      quote: vQuote, job: vJob, portfolio: vPortfolio, editPg: vEditPg,
                      payResult: vPayResult, editPayout: vEditPayout,
                      pgEarnings: vPgEarnings, pgDone: vPgDone, pgReviews: vPgReviews, how: vHow, storage: vStorage, rewards: vRewards, invite: vInvite, kyc: vKyc, deleteAccount: vDeleteAccount,
                      report: vReport, blockedPeople: vBlockedPeople };
const CUST_TABS = [ ["home","Home","home",vCustHome], ["explore","Explore","search",vExplore], ["activity","Shoots","calendar",vActivity], ["profile","Profile","user",vProfile] ];
const PG_TABS   = [ ["home","Home","home",vPgHome], ["requests","Requests","bolt",vPgRequests], ["jobs","Shoots","calendar",vJobs], ["profile","Profile","user",vProfile] ];
const tabsFor = () => isPg() ? PG_TABS : CUST_TABS;

function scrollTop(){ try{ window.scrollTo(0, 0); }catch(e){} }
let ignorePop = 0;
function push(v, p){
  S.formErr = null; S.editPg = null;
  S.stack.push({ v, p: p || {} });
  try{ history.pushState({ snap: S.stack.length }, ""); }catch(e){}
  render(); scrollTop();
}
function pop(){
  if(!S.stack.length) return;
  S.stack.pop(); S.formErr = null;
  if(history.state && history.state.snap){ ignorePop++; try{ history.back(); }catch(e){ ignorePop--; } }
  render();
}
function replaceStack(v, p){
  S.formErr = null;
  if(S.stack.length) S.stack[S.stack.length - 1] = { v, p: p || {} }; else { S.stack.push({ v, p: p || {} }); try{ history.pushState({ snap: 1 }, ""); }catch(e){} }
  render(); scrollTop();
}
function go(tab){ S.tab = tab; S.stack = []; S.formErr = null; navMark(tab === "home"); render(); scrollTop(); }
window.addEventListener("popstate", () => {
  if(ignorePop){ ignorePop--; return; }
  if(S.stack.length){ S.stack.pop(); S.formErr = null; render(); return; }
  softBack();
});

function tabBadge(id){
  if(isCustomer() && id === "activity") return customerActions().filter(a => a.urgent).length;
  if(isPg() && id === "requests") return newForMe().length;
  if(isPg() && id === "jobs") return S.d.bookings.filter(b => activeBk(b) && (b.status !== "confirmed" || soonMs(b) < 24*3600e3)).length;
  return 0;
}
function tabbarHtml(){
  return `<nav class="tabbar">${tabsFor().map(([id, label, ic]) => {
    const n = tabBadge(id);
    return `<button class="tab ${S.tab===id?'on':''}" onclick="go('${id}')" aria-label="${label}">${icon(ic,21)}<span>${label}</span>${n ? `<span class="badge">${n}</span>` : ""}</button>`;
  }).join("")}</nav>`;
}

function render(){
  const screen = el("screen"), tabs = el("tabs");
  if(!screen) return;
  pendingRender = false;
  let html = "", showTabs = false, mode = "";
  if(!S.booted){
    html = `<div class="splash"><div class="center"><div class="logo-lg">${icon("cam",32,"var(--on-text)",2)}</div><div class="h2 mt16">SnapPro</div></div></div>`;
  } else if(!S.me || /^setup/.test(S.auth.step || "")){
    html = (AUTH_VIEWS[S.auth.step] || vWelcome)();
  } else if(S.blocked){
    html = vBlocked();
  } else if(pgWaiting() && !(S.stack.length && WAITING_OK.includes(S.stack[S.stack.length - 1].v))){
    S.stack = []; html = vPgReview();
  } else if(S.stack.length){
    const top = S.stack[S.stack.length - 1];
    html = (STACK_VIEWS[top.v] || (() => ""))(top.p || {});
    if(top.v === "chat") mode = "chat-mode";
  } else {
    const t = tabsFor().find(x => x[0] === S.tab) || tabsFor()[0];
    S.tab = t[0]; html = t[3](); showTabs = true;
  }
  screen.innerHTML = html;
  screen.className = (showTabs ? "" : "no-tabs ") + mode;
  if(tabs) tabs.innerHTML = showTabs ? tabbarHtml() : "";
  syncChatTimer();
}

/* chat refreshes every 3 seconds while it's open */
function syncChatTimer(){
  const top = S.stack[S.stack.length - 1];
  const id = top && top.v === "chat" ? top.p.id : null;
  if(id && S.chatId === id && chatTimer) return;
  if(chatTimer){ clearInterval(chatTimer); chatTimer = null; }
  S.chatId = id;
  if(id){
    chatTimer = setInterval(() => { if(!document.hidden) loadChat(id); }, 3000);
    const c = el("chatList"); if(c) c.scrollTop = c.scrollHeight;
  }
}

/* "12m left" counters tick without redrawing the page */
setInterval(() => {
  document.querySelectorAll("[data-until]").forEach(n => { n.textContent = leftStr(n.getAttribute("data-until")); });
}, 15000);

document.addEventListener("visibilitychange", () => { if(!document.hidden && S.me && !/^setup/.test(S.auth.step||"")) refresh(true); });

/* ============================================================
   START
   ============================================================ */
/* Visitor count for the admin dashboard: a random ID kept in this browser.
   No name, email or IP address is sent. */
function visitorId(){
  const k = "snappro.vid";
  try{
    let id = localStorage.getItem(k);
    if(!id || !/^[0-9a-f-]{36}$/i.test(id)){
      id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
         : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c === "x" ? r : (r&3|8)).toString(16); });
      localStorage.setItem(k, id);
    }
    return id;
  }catch(e){ return null; }
}
/* count a fresh visit when someone comes back to an open tab after 10+ minutes */
document.addEventListener("visibilitychange", () => { if(!document.hidden && trackVisit.at && Date.now() - trackVisit.at > 600000) trackVisit(); });
function trackVisit(){
  try{
    if(!sb) return;
    const id = visitorId(); if(!id) return;
    const ua = navigator.userAgent || "";
    const device = /iPad|Tablet/i.test(ua) ? "tablet" : /Mobi|Android|iPhone/i.test(ua) ? "mobile" : "desktop";
    let ref = null;
    try{ if(document.referrer){ const h = new URL(document.referrer).hostname; if(h && h !== location.hostname) ref = h.replace(/^www\./, ""); } }catch(e){}
    const T = (typeof TOUCH !== "undefined" && TOUCH) || { utm: {} };
    Promise.resolve(sb.rpc("track_visit", { p_visitor: id, p_path: location.pathname, p_referrer: ref || T.referrer, p_device: device, p_utm: T.utm })).catch(() => {});
    trackVisit.at = Date.now();
  }catch(e){}
}

async function boot(){
  render();
  const ok = await ensureSb();
  S.booted = true;
  if(ok) trackVisit();
  if(!ok){ S.auth = { step: "welcome" }; render(); toast("Couldn't connect", "Check your internet and refresh the page", "x"); return; }
  let session = null;
  try{ const { data } = await sb.auth.getSession(); session = data && data.session; }catch(e){}
  /* links from snappro.in: app.html#signup, #join (photographers), #login */
  const want = (location.hash || "").replace("#", "");
  /* app.html?payment=<order id> opens the payment result for that order */
  const back = new URLSearchParams(location.search).get("payment");
  if(back && /^[A-Za-z0-9_-]{3,45}$/.test(back)) S.returnOrder = back;
  /* app.html?open=booking&id=… — from a notification */
  S.openAfter = openTargetFromUrl(location.href);
  if(want || back || S.openAfter){ try{ history.replaceState(null, "", location.pathname); }catch(e){} }
  if(session){ await afterAuth(false); }
  else if(want === "signup"){ pwReset(); S.auth = { step: "signup", type: "customer", email: "" }; navMark(false); render(); }
  else if(want === "join"){ pwReset(); S.auth = { step: "signup", type: "photographer", email: "" }; navMark(false); render(); }
  else if(want === "login"){ pwReset(); S.auth = { step: "login", email: "" }; navMark(false); render(); }
  else { S.auth = { step: "welcome" }; render(); }
  sb.auth.onAuthStateChange(ev => {
    if(ev === "SIGNED_OUT" && S.me){
      stopPolling(); S.me = null; S.pg = null; S.stack = []; S.auth = { step: "login", email: "" };
      render(); toast("You've been logged out", "Please log in again", "logout");
    }
  });
}
if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();

function vBlocked(){
  const b = S.blocked || {};
  return `<div class="pad center" style="padding-top:12vh">
    <div class="bad-mark">${icon("x",26,"#fff",3)}</div>
    <h1 class="display-sm mt16">${b.reason === "Account deleted" ? "This account was deleted" : "Your account is " + (b.status === "blocked" ? "blocked" : "suspended")}</h1>
    ${b.reason ? `<p class="sm muted mt8">Reason: ${esc(b.reason)}</p>` : ""}
    ${b.until ? `<p class="sm muted mt4">Until ${dayStr(b.until)}</p>` : ""}
    <p class="sm muted mt12">If you think this is a mistake, write to <a href="mailto:${SUPPORT_EMAIL}">${SUPPORT_EMAIL}</a> with your SnapPro ID${S.me && S.me.public_id ? " (" + esc(S.me.public_id) + ")" : ""}.</p>
    <button class="btn block mt20" onclick="logout()">Log out</button></div>`;
}
