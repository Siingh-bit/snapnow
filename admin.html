<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>SnapPro Operations</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0a0a0f; --surface:#14141c; --surface-2:#1c1c26; --surface-3:#252533;
  --border:#2b2b3a; --border-soft:#22222e; --text:#f4f4f7; --muted:#8b8b9e; --muted-2:#61617a;
  --accent:#ff5a1f; --accent-soft:rgba(255,90,31,.14);
  --green:#28c76f; --red:#ff4d5e; --blue:#4d8dff; --purple:#a67cff;
  --r:14px; --ff:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:
  radial-gradient(900px 600px at 85% -10%,rgba(255,90,31,.10),transparent 60%),
  radial-gradient(800px 500px at 5% 110%,rgba(166,124,255,.10),transparent 60%),var(--bg);
  color:var(--text);font-family:var(--ff);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 60px}
.center-card{max-width:400px;margin:8vh auto;padding:0 20px}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:26px}
.mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--accent),#ff8a3d);
  display:grid;place-items:center;box-shadow:0 8px 22px -6px rgba(255,90,31,.6)}
.bname{font-weight:800;font-size:19px;letter-spacing:-.5px}
.btag{font-size:11px;color:var(--muted-2);margin-top:-2px}
.card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--r);padding:16px}
.h1{font-size:23px;font-weight:800;letter-spacing:-.7px}
.h2{font-size:17px;font-weight:750;letter-spacing:-.3px}
.sm{font-size:13px}.xs{font-size:11.5px}
.muted{color:var(--muted)}.muted2{color:var(--muted-2)}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grow{flex:1;min-width:0}
.sec{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted-2);font-weight:700;margin-bottom:10px}
.input{width:100%;padding:12px 14px;border-radius:12px;background:var(--surface);
  border:1px solid var(--border);outline:none;transition:.15s}
.input:focus{border-color:var(--accent);background:var(--surface-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;
  border-radius:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--border);transition:.15s}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:linear-gradient(135deg,var(--accent),#ff7a3d);border-color:transparent;color:#fff}
.btn.danger{border-color:rgba(255,77,94,.4);color:var(--red)}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--border);font-size:11px;font-weight:700;color:var(--muted)}
.chip.super{background:rgba(255,90,31,.15);border-color:rgba(255,90,31,.4);color:#ffab86}
.chip.admin{background:rgba(77,141,255,.15);border-color:rgba(77,141,255,.4);color:#8fb6ff}
.chip.manager{background:rgba(166,124,255,.15);border-color:rgba(166,124,255,.4);color:#c4a6ff}
.chip.green{background:rgba(40,199,111,.14);border-color:rgba(40,199,111,.35);color:#5fe0a0}
.chip.red{background:rgba(255,77,94,.14);border-color:rgba(255,77,94,.35);color:#ff8f9b}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--r);padding:14px}
.stat .v{font-size:22px;font-weight:800;letter-spacing:-.6px}
.stat .l{font-size:11px;color:var(--muted-2);font-weight:600;margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted-2);font-weight:700;font-size:10px;letter-spacing:.8px;
  text-transform:uppercase;padding:9px 8px;border-bottom:1px solid var(--border)}
td{padding:11px 8px;border-bottom:1px solid var(--border-soft);vertical-align:middle}
.tabs{display:flex;gap:6px;background:var(--surface);padding:4px;border-radius:13px;border:1px solid var(--border-soft)}
.tab{padding:8px 16px;border-radius:10px;font-size:13.5px;font-weight:700;color:var(--muted-2)}
.tab.on{background:var(--surface-3);color:var(--text)}
.otp{display:flex;gap:7px;justify-content:center;margin:18px 0}
.otp i{width:44px;height:54px;border-radius:12px;display:grid;place-items:center;font-size:21px;
  font-weight:800;font-style:normal;background:var(--surface);border:1.5px solid var(--border)}
.otp i.on{border-color:var(--accent)}
.err{color:var(--red);font-size:12.5px;margin-top:10px}
.ok{color:var(--green);font-size:12.5px;margin-top:10px}
.warn{background:rgba(255,200,87,.1);border:1px solid rgba(255,200,87,.35);color:#ffd88a;border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.5}
.chip.amber{background:rgba(255,200,87,.12);border-color:rgba(255,200,87,.35);color:#ffd88a}
.tblwrap{overflow-x:auto}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
.sw input{accent-color:var(--green);width:16px;height:16px}
.empty{text-align:center;padding:40px 20px;color:var(--muted-2)}
.wrap{max-width:1240px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.chart-box{position:relative;height:280px;margin-top:10px}
.stat.hl{border-color:rgba(255,90,31,.35);background:linear-gradient(145deg,rgba(255,90,31,.12),var(--surface))}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(40,199,111,.6);animation:live 2s infinite}
@keyframes live{0%{box-shadow:0 0 0 0 rgba(40,199,111,.6)}70%{box-shadow:0 0 0 8px rgba(40,199,111,0)}100%{box-shadow:0 0 0 0 rgba(40,199,111,0)}}
.tab{white-space:nowrap}
.tab .count{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px}
.stackc{display:flex;flex-direction:column;gap:12px}
.pcard{border-color:rgba(255,200,87,.3)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;display:block;background:var(--surface-2)}
.linkbtn{color:var(--accent);font-weight:700;font-size:12.5px}
details>summary{list-style:none}details>summary::-webkit-details-marker{display:none}
.spin{width:44px;height:44px;margin:0 auto;border-radius:50%;border:3px solid var(--surface-3);
  border-top-color:var(--accent);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pw-wrap{position:relative}
.pw-wrap .input{padding-right:66px}
.pw-eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:700;color:var(--muted);padding:6px 9px;border-radius:8px}
.pw-eye:hover{color:var(--text);background:var(--surface-2)}
.pw-rules{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;margin-top:9px}
.pw-rule{font-size:11.5px;color:var(--muted-2);font-weight:600}
.pw-rule.ok{color:var(--green)} .pw-rule.bad{color:var(--red)}
.input.pw-bad{border-color:var(--red)!important}
.pw-flash{animation:pwFlash .8s ease}
@keyframes pwFlash{0%,100%{transform:translateX(0);box-shadow:none}
  15%,45%,75%{transform:translateX(-6px);box-shadow:0 0 0 3px rgba(255,77,94,.5)}
  30%,60%,90%{transform:translateX(6px);box-shadow:0 0 0 3px rgba(255,77,94,.5)}}
.pw-flash-text{animation:pwText .8s ease}
@keyframes pwText{0%,100%{opacity:1}25%,75%{opacity:.2}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.pw-flash,.pw-flash-text{animation:none}}
.field{margin-top:12px}.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px}
.linkbtn{font-size:12px;font-weight:700;color:var(--accent)}
/* clickable tiles, drill-down sheet, reports */
button.stat{text-align:left;width:100%;font:inherit;color:inherit;cursor:pointer;transition:border-color .15s,transform .15s}
button.stat:hover{border-color:rgba(255,90,31,.45)}
button.stat:active{transform:scale(.985)}
.stat .go{color:var(--accent);font-weight:800;margin-left:2px}
.sheet-bg{position:fixed;inset:0;background:rgba(5,5,10,.72);backdrop-filter:blur(3px);z-index:50;display:flex;justify-content:center;align-items:flex-start;padding:4vh 14px;overflow-y:auto}
.sheet-bg.top{z-index:60}
.sheet{width:100%;max-width:1180px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;box-shadow:0 30px 80px -20px rgba(0,0,0,.7)}
.sheet.narrow{max-width:900px}
.rowlink{cursor:pointer}.rowlink:hover td{background:var(--surface-2)}
.kvr{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid var(--border-soft);font-size:13px}
.kvr>span:last-child{text-align:right}
.chart-box.sm{height:220px}
.funnel{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.fstep{display:grid;grid-template-columns:190px 1fr 130px;align-items:center;gap:12px;padding:6px 8px;border-radius:9px;text-align:left}
.fstep:hover{background:var(--surface-2)}
.flabel{font-size:13px;font-weight:600}
.fbar{height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.fbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#ff8a3d);border-radius:6px}
.fnum{font-size:13px;font-weight:700;text-align:right}
td{white-space:nowrap}
.miniclick tr{cursor:pointer}.miniclick tr:hover td{background:var(--surface-2)}
@media (max-width:640px){.fstep{grid-template-columns:1fr 80px}.fbar{grid-column:1/-1;grid-row:2}}
</style>
</head>
<body>
<div id="app"><div class="center-card"><div class="spin" style="margin-top:20vh"></div></div></div>

<script>
"use strict";

const SUPABASE_URL = "https://eafudrjxjtenqoorjzsc.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_n8ub8dzUbfa5uJqA_PHDXw_QLJJINCd";

const ROLES = [
  {id:"super_admin", label:"Super admin", desc:"Everything, including managing staff"},
  {id:"admin",       label:"Admin",       desc:"All operations data and customer details"},
  {id:"manager",     label:"Manager",     desc:"Bookings and requests only"}
];
const roleLabel = r => (ROLES.find(x=>x.id===r)||{label:r}).label;

let sb = null;
const S = {
  view: "login",
  email: "", otp: "", busy: false, err: "", note: "",
  me: null,              // staff row
  tab: "overview",
  stats: null, staff: [], invites: [], bookings: [], requests: [], photographers: [],
  emailReady: null, emailStatus: {},
  period: { mode: "day", from: "", to: "" }, insights: null, insightErr: "", insightBusy: false, updatedAt: null,
  users: null, usersErr: "", usersFilter: "all", usersQ: "",
  inviteEmail: "", inviteRole: "manager"
};

const el = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr = n => "₹"+Math.round(n||0).toLocaleString("en-IN");
const fmt = d => d ? new Date(d).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}) : "—";

function camIcon(size,color){
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>`;
}
const brand = `<div class="brand"><div class="mark">${camIcon(21,"#fff")}</div>
  <div><div class="bname">SnapPro</div><div class="btag">Operations console</div></div></div>`;

/* ============================ auth ============================ */

/* Password kept out of S so it is never rendered back into logs or state dumps. */
var PW = { pw:"", pw2:"", show:false, touched:false, flash:false };
function pwReset(){ PW = { pw:"", pw2:"", show:false, touched:false, flash:false }; }
function pwRules(p){
  p = p || "";
  return [
    { ok: p.length >= 8,   t: "At least 8 characters" },
    { ok: /[a-z]/.test(p), t: "One lowercase letter" },
    { ok: /[A-Z]/.test(p), t: "One uppercase letter" },
    { ok: /[0-9]/.test(p), t: "One number" }
  ];
}
function pwStrong(){ return pwRules(PW.pw).every(r => r.ok); }
function pwBlock(needConfirm){
  const bad = !pwStrong() || (needConfirm && PW.pw !== PW.pw2);
  if(!bad) return false;
  PW.touched = true; PW.flash = true; render();
  setTimeout(()=>{ PW.flash = false; render(); }, 850);
  return true;
}
function pwFieldsHtml(label){
  const rules = pwRules(PW.pw);
  const live = PW.touched || PW.pw.length > 0;
  const weak = live && !rules.every(r => r.ok);
  const mism = (PW.touched || PW.pw2.length > 0) && PW.pw2 !== PW.pw;
  const type = PW.show ? "text" : "password";
  return `
  <div class="field"><label>${label}</label>
    <div class="pw-wrap">
      <input id="pw1" class="input ${weak?'pw-bad':''} ${PW.flash&&weak?'pw-flash':''}" type="${type}" autocomplete="new-password"
        placeholder="Create a strong password" value="${esc(PW.pw)}" oninput="pwInput('pw',this.value)">
      <button type="button" class="pw-eye" onclick="pwToggleShow()">${PW.show?'Hide':'Show'}</button>
    </div>
    <div class="pw-rules" id="pwRules">${pwRulesInner()}</div>
  </div>
  <div class="field"><label>Confirm password</label>
    <input id="pw2" class="input ${mism?'pw-bad':''} ${PW.flash&&mism?'pw-flash':''}" type="${type}" autocomplete="new-password"
      placeholder="Type it again" value="${esc(PW.pw2)}" oninput="pwInput('pw2',this.value)">
    <div id="pwMatch">${pwMatchInner()}</div>
  </div>`;
}
/* Typing must never rebuild the field being typed into: on phones a
   rebuilt field reopens the keyboard in its default layout. */
function setHtml(id, html){ const n = el(id); if(n) n.innerHTML = html; }
function setCls(id, cls, on){ const n = el(id); if(n) n.classList.toggle(cls, !!on); }
function clearErr(){ S.err = ""; document.querySelectorAll('#app .err').forEach(n => n.remove()); }
function pwRulesInner(){
  const live = PW.touched || PW.pw.length > 0;
  return pwRules(PW.pw).map(r=>`<div class="pw-rule ${r.ok?'ok':(live?'bad':'')} ${PW.flash&&!r.ok?'pw-flash-text':''}">${r.ok?'✓':(live?'✗':'•')} ${r.t}</div>`).join('');
}
function pwMatchInner(){
  const m = (PW.touched || PW.pw2.length > 0) && PW.pw2 !== PW.pw;
  if(m) return `<div class="xs mt8 ${PW.flash?'pw-flash-text':''}" style="color:var(--red)">✗ Passwords don't match</div>`;
  if(PW.pw2 && PW.pw2 === PW.pw) return `<div class="xs mt8" style="color:var(--green)">✓ Passwords match</div>`;
  return '';
}
function pwPaint(){
  const live = PW.touched || PW.pw.length > 0;
  setHtml("pwRules", pwRulesInner());
  setCls("pw1","pw-bad", live && !pwStrong());
  if(el("pw2")){ setCls("pw2","pw-bad",(PW.touched||PW.pw2.length>0)&&PW.pw2!==PW.pw); setHtml("pwMatch", pwMatchInner()); }
}
function pwInput(k, v){ PW[k] = v; clearErr(); pwPaint(); }
function pwToggleShow(){
  PW.show = !PW.show;
  ["pw1","pw2","pwl"].forEach(id=>{ const n=el(id); if(n) n.type = PW.show?"text":"password"; });
  document.querySelectorAll(".pw-eye").forEach(b=>b.textContent = PW.show?"Hide":"Show");
}
function otpInput(v){
  const code = String(v).replace(/\D/g,"").slice(0,6);
  S.otp = code; clearErr();
  const inp = el("ot"); if(inp && inp.value !== code) inp.value = code;
  setHtml("otpBoxes", [0,1,2,3,4,5].map(i=>`<i class="${code.length===i?'on':''}">${esc(code[i]||'')}</i>`).join(''));
  const b = el("otpVerify"); if(b) b.disabled = !(code.length===6 && !S.busy);
}
function friendly(e){
  const m=(e&&e.message)||"", c=(e&&e.code)||"";
  if(c==="weak_password"||(/password/i.test(m)&&/weak|should|least|contain|characters/i.test(m))) return "That password doesn't meet the requirements.";
  if(/different from the old/i.test(m)) return "Choose a password you haven't used before.";
  if(/invalid login credentials/i.test(m)) return "Wrong email or password.";
  if(/email not confirmed/i.test(m)) return "Confirm your email first.";
  if(/signups not allowed|user not found/i.test(m)) return "There's no account with that email.";
  if(/rate limit|too many|security purposes/i.test(m)) return "Too many attempts. Wait a minute and try again.";
  if(/expired|invalid/i.test(m)&&/token|otp|code/i.test(m)) return "That code is wrong or has expired.";
  return m||"Something went wrong. Try again.";
}
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
function openTab(k){
  S.tab = k; S.err = ''; S.note = '';
  render();
  if(k === 'overview') loadInsights(!!S.insights);
  if(k === 'users') loadUsers(!!S.users);
  if(k === 'pros'){ loadData(); if(S.me.role !== 'manager') loadUsers(true); }
  if(k === 'payments') loadPayments(!!S.pay);
}
function go(view, patch){ Object.assign(S, patch||{}, { view, err:"" }); render(); }

async function boot(){
  if(!(window.supabase && window.supabase.createClient)){ setTimeout(boot,300); return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  /* the invite email links to admin.html#setup=their@email */
  let invited = "";
  const m = /[#&]setup=([^&]+)/.exec(location.hash || "");
  if(m){ try{ invited = decodeURIComponent(m[1]).trim().toLowerCase(); }catch(e){} try{ history.replaceState(null, "", location.pathname); }catch(e){} }
  const { data } = await sb.auth.getSession();
  if(data && data.session) await loadMe();
  else if(EMAIL_RE.test(invited)){ pwReset(); S.email = invited; S.invited = true; S.view = "setup"; render(); }
  else { S.view="login"; render(); }
}

/* Signing in proves who they are; the staff table decides whether they belong.
   claim_staff_invite() runs server-side and grants a pending invite to the
   signed-in email — it works for brand-new and already-existing accounts. */
async function loadMe(){
  S.busy = true; render();
  const { data: u } = await sb.auth.getUser();
  if(!u || !u.user){ S.busy=false; S.view="login"; render(); return; }

  try{ await sb.rpc('claim_staff_invite'); }catch(e){}

  const { data: row, error } = await sb.from('staff')
    .select('id,email,name,role,status').eq('id', u.user.id).maybeSingle();
  S.busy = false;
  if(error){ S.err = "Couldn't verify access: "+error.message; S.view="login"; render(); return; }
  if(!row){ S.view="denied"; S.deniedEmail=u.user.email; S.suspended=false; render(); return; }
  if(row.status !== 'active'){ S.view="denied"; S.deniedEmail=u.user.email; S.suspended=true; render(); return; }
  S.me = row; S.view = "console"; render();
  loadData();
  loadInsights();
  if(row.role !== 'manager') loadUsers(true);
}

async function signIn(){
  const email = S.email.trim().toLowerCase();
  if(!EMAIL_RE.test(email)){ S.err="Enter a valid email address."; render(); return; }
  if(!PW.pw){ PW.touched=true; PW.flash=true; render(); setTimeout(()=>{PW.flash=false;render();},850); return; }
  S.busy=true; S.err=""; render();
  const { data, error } = await sb.auth.signInWithPassword({ email, password: PW.pw });
  S.busy=false;
  if(error){
    let m = friendly(error);
    if(m==="Wrong email or password.") m += " First time here? Use “Set up your account”. Signed in with a code before? Use “Forgot password?”.";
    if(m==="Confirm your email first."){ S.email=email; S.mode="signup"; pwReset(); await sb.auth.resend({type:'signup',email}); go("code"); return; }
    S.err=m; render(); return;
  }
  pwReset(); S.email=email;
  await loadMe();
}

async function signUp(){
  const email = S.email.trim().toLowerCase();
  if(!EMAIL_RE.test(email)){ S.err="Enter a valid email address."; render(); return; }
  if(pwBlock(true)) return;
  S.busy=true; S.err=""; render();
  const { data, error } = await sb.auth.signUp({ email, password: PW.pw });
  S.busy=false;
  if(error){ S.err=friendly(error); render(); return; }
  if(data && data.user && Array.isArray(data.user.identities) && data.user.identities.length===0){

/* All dates are India time, whatever the computer's clock is set to. */
const IST_MS = 5.5 * 3600e3;
const istToday = () => new Date(Date.now() + IST_MS).toISOString().slice(0, 10);
const addDays = (d, n) => { const x = new Date(d + "T00:00:00Z"); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const dayDiff = (a, b) => Math.round((Date.parse(b + "T00:00:00Z") - Date.parse(a + "T00:00:00Z")) / 864e5);
const PERIODS = [["day","Daily"],["week","Weekly"],["month","Monthly"],["year","Yearly"],["custom","Custom"]];

function periodRange(){
  const p = S.period, t = istToday();
  if(p.mode === "day")  return { from: addDays(t, -29), to: t, bucket: "day",  label: "Last 30 days" };
  if(p.mode === "week"){ const dow = (new Date(t + "T00:00:00Z").getUTCDay() + 6) % 7;
                         return { from: addDays(addDays(t, -dow), -77), to: t, bucket: "week", label: "Last 12 weeks" }; }
  if(p.mode === "month"){ const [y, m] = t.split("-").map(Number); const d = new Date(Date.UTC(y, m - 12, 1));
                         return { from: d.toISOString().slice(0, 10), to: t, bucket: "month", label: "Last 12 months" }; }
  if(p.mode === "year") return { from: (Number(t.slice(0, 4)) - 4) + "-01-01", to: t, bucket: "year", label: "Last 5 years" };
  let from = p.from || addDays(t, -29), to = p.to || t;
  if(from > to){ const x = from; from = to; to = x; }
  const n = dayDiff(from, to);
  const bucket = n <= 62 ? "day" : n <= 182 ? "week" : n <= 1100 ? "month" : "year";
  return { from, to, bucket, label: fmtDay(from) + " – " + fmtDay(to) };
}
function fmtDay(d){ return new Date(d + "T00:00:00Z").toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" }); }
function bucketLabel(d, b){
  const x = new Date(String(d).slice(0, 10) + "T00:00:00Z"), o = { timeZone: "UTC" };
  if(b === "day")   return x.toLocaleDateString("en-IN", { ...o, day: "numeric", month: "short" });
  if(b === "week")  return "w/c " + x.toLocaleDateString("en-IN", { ...o, day: "numeric", month: "short" });
  if(b === "month") return x.toLocaleDateString("en-IN", { ...o, month: "short", year: "numeric" });
  return String(x.getUTCFullYear());
}

let insightSeq = 0;
async function loadInsights(quiet){
  const r = periodRange(), seq = ++insightSeq;
  if(!quiet){ S.insightErr = ""; S.insightBusy = true; render(); }
  const [se, kp] = await Promise.all([
    sb.rpc("admin_series", { p_from: r.from, p_to: r.to, p_bucket: r.bucket }),
    sb.rpc("admin_kpis",   { p_from: r.from, p_to: r.to })
  ]);
  if(seq !== insightSeq) return;                 // a newer period was picked meanwhile
  S.insightBusy = false;
  const err = (se && se.error) || (kp && kp.error);
  if(err){
    S.insightErr = /admin_series|admin_kpis|function/i.test(err.message)
      ? "Charts need the latest database update — run supabase/snappro.sql in the Supabase SQL Editor."
      : "Couldn't load charts: " + err.message;
    render(); return;
  }
  loadReport();
  const next = { series: se.data || [], kpis: kp.data || null, range: r };
  const changed = JSON.stringify(next) !== JSON.stringify(S.insights);
  S.insights = next; S.updatedAt = new Date();
  if(!quiet || changed) render(); else paintUpdated();
}

}

let charts = [];
function drawCharts(){
  charts.forEach(c => { try{ c.destroy(); }catch(e){} }); charts = [];
  if(S.view !== "console" || S.tab !== "overview" || !window.Chart || !S.insights) return;
  const rows = S.insights.series, b = S.insights.range.bucket;
  const labels = rows.map(x => bucketLabel(x.bucket, b));
  const grid = "rgba(255,255,255,.06)", tick = "#8b8b9e";
  const base = (money) => ({
    responsive: true, maintainAspectRatio: false, animation: false,
    interaction: { mode: "index", intersect: false },
    plugins: { legend: { labels: { color: "#c9c9d6", boxWidth: 12, font: { size: 11 } } },
      tooltip: { callbacks: money ? { label: c => c.dataset.label + ": " + inr(c.parsed.y) } : {} } },
    scales: { x: { grid: { color: grid }, ticks: { color: tick, maxRotation: 0, autoSkip: true, maxTicksLimit: 10 } },
              y: { beginAtZero: true, grid: { color: grid }, ticks: money ? { color: tick, precision: 0, callback: v => inr(v) } : { color: tick, precision: 0 } } }
  });
  const mk = (id, cfg) => { const c = el(id); if(c) charts.push(new Chart(c, cfg)); };
  mk("chRevenue", { type: "bar", options: base(true), data: { labels, datasets: [

/* ========================== payments ========================== */
const PAY_FILTERS = [["all","All"],["paid","Paid"],["problem","Failed / not completed"],["refunds","Refunds"],["open","Waiting"]];
async function loadPayments(quiet){
  const [p, b, r, po, cs] = await Promise.all([
    sb.from('payments').select('id,order_id,booking_id,customer_id,photographer_id,amount,currency,commission_amount,photographer_amount,status,environment,provider,gateway_order_id,gateway_payment_id,payment_group,bank_reference,payment_message,paid_at,refund_status,refunded_amount,is_duplicate,note,stage,created_at').order('created_at',{ascending:false}).limit(1000),
    sb.from('bookings').select('id,customer_name,photographer_name,photographer_id,start_at,status,price,commission_amount,photographer_amount,payment_status,payout_status,payout_ref,payout_at,cancelled_from,cancelled_by,advance_amount,balance_amount,balance_status,customer_id').order('start_at',{ascending:false}).limit(1000),
    sb.from('refunds').select('id,refund_id,payment_id,order_id,amount,status,gateway_refund_id,refund_arn,reason,created_at,processed_at').order('created_at',{ascending:false}).limit(1000),
    sb.from('photographer_payout').select('id,upi_id,account_name'),
    sb.from('platform_settings').select('value').eq('key','commission_pct').maybeSingle()
  ]);
  const err = [p,b,r,po].find(x => x && x.error);
  if(err){
    S.payErr = /payments|refunds|photographer_payout|does not exist|schema cache/i.test(err.error.message)
      ? "Payments need the latest database update — run supabase/snappro.sql in the Supabase SQL Editor."
      : "Couldn't load payments: " + err.error.message;
    if(!quiet) render(); return;
  }
  const next = { payments: p.data || [], bookings: b.data || [], refunds: r.data || [], payouts: po.data || [], commission: cs && cs.data ? Number(cs.data.value) : 20 };
  const changed = JSON.stringify(next) !== JSON.stringify(S.pay);
  S.pay = next; S.payErr = "";
  if(!quiet || changed) render();
}
const payRef = id => id ? "SP-" + String(id).slice(0,8).toUpperCase() : "—";
const methodName = g => ({upi:"UPI", card:"Card", netbanking:"Net banking", emi:"EMI", paylater:"Pay later", credit_card:"Credit card", debit_card:"Debit card", net_banking:"Net banking", wallet:"Wallet", credit_card_emi:"Card EMI", debit_card_emi:"Card EMI", pay_later:"Pay later", cardless_emi:"EMI"})[g] || (g ? g.replace(/_/g," ") : "—");
function payChip(p){
  const m = {paid:["green","Paid"], failed:["red","Failed"], user_dropped:["amber","Not completed"], cancelled:["red","Cancelled"],
             active:["","Waiting"], created:["","Waiting"], expired:["","Expired"], terminated:["","Closed"]}[p.status] || ["",p.status];
  return `<span class="chip ${m[0]}">${m[1]}</span>${p.environment === "test" || p.environment === "sandbox" ? ` <span class="chip">Test</span>` : ""}`;
}
function refundChip(p){
  const m = {none:null, refund_due:["amber","Refund due"], refund_pending:["","Refund processing"], refunded:["green","Refunded"],
             partially_refunded:["green","Part refunded"], refund_failed:["red","Refund failed"]}[p.refund_status];
  return m ? `<span class="chip ${m[0]}">${m[1]}</span>` : `<span class="muted2">—</span>`;
}
function payMatches(p){
  const f = S.payFilter || "all";
  if(f === "paid") return p.status === "paid";
  if(f === "problem") return ["failed","user_dropped","cancelled"].includes(p.status);
  if(f === "refunds") return p.refund_status !== "none";
  if(f === "open") return ["created","active"].includes(p.status);
  return true;
}
async function payFn(body){
  const { data, error } = await sb.functions.invoke("payments", { body });
  if(error){ let m = error.message; try{ const j = await error.context.json(); if(j && j.error) m = j.error; }catch(e){} throw new Error(m); }
  return data;
}
/* refund policy: 100%, except customer cancelling after the photographer set off → 50% */
function policyRefund(p){
  const b = S.pay.bookings.find(x => x.id === p.booking_id) || {};
  const left = Number(p.amount) - Number(p.refunded_amount || 0);
  if(p.is_duplicate || p.note) return { amount: left, why: p.note || "Duplicate payment" };
  if(b.status === "cancelled" && b.cancelled_by === "customer" && b.cancelled_from === "enroute")
    return { amount: Math.min(left, Math.round(Number(p.amount) / 2)), why: "Customer cancelled after the photographer set off — 50% per policy" };
  if(b.status === "cancelled") return { amount: left, why: (b.cancelled_by === "photographer" ? "Photographer cancelled" : "Customer cancelled before the photographer set off") + " — full refund" };
  return { amount: left, why: "" };
}
async function refundPayment(id){
  const p = S.pay.payments.find(x => x.id === id); if(!p) return;
  const left = Number(p.amount) - Number(p.refunded_amount || 0);
  const pol = policyRefund(p);
  const amt = prompt("Refund how much to the customer? (maximum " + inr(left) + ")" + (pol.why ? "\nPolicy: " + pol.why : ""), String(pol.amount));
  if(amt === null) return;
  const n = Math.round(Number(amt) * 100) / 100;
  if(!(n > 0) || n > left){ S.err = "Enter an amount between ₹1 and " + inr(left) + "."; render(); return; }
  const reason = prompt("Reason (the customer may see this on their bank statement)", p.is_duplicate ? "Duplicate payment" : "Booking cancelled");
  if(reason === null) return;
  if(!confirm("Refund " + inr(n) + " for booking " + payRef(p.booking_id) + "? This sends money back through Razorpay and can't be undone.")) return;
  S.err = ""; S.note = ""; S.busyId = id; render();
  try{ const r = await payFn({ action: "refund", payment_id: id, amount: n, reason }); S.note = "Refund of " + inr(n) + " started (" + (r.status || "pending") + "). Razorpay usually completes normal refunds in 5–7 working days."; }
  catch(e){ S.err = "Refund failed: " + e.message; }
  S.busyId = null; await loadPayments();
}
async function checkRefund(refundId, gatewayRefundId){
  S.err = ""; S.note = "";
  try{ const r = await payFn({ action: "refund_check", refund_id: refundId, gateway_refund_id: gatewayRefundId }); S.note = "Refund status: " + r.status; }
  catch(e){ S.err = "Couldn't check: " + e.message; }
  await loadPayments();
}
async function markPaidOut(bookingId){
  const b = S.pay.bookings.find(x => x.id === bookingId); if(!b) return;
  const ref = prompt("You've sent " + inr(b.photographer_amount) + " to " + (b.photographer_name || "the photographer") + ".\nEnter the UPI / bank transfer reference (UTR):");
  if(ref === null) return;
  S.err = ""; S.note = "";
  const { error } = await sb.rpc("admin_mark_payout", { p_booking: bookingId, p_ref: ref });
  if(error){ S.err = error.message; render(); return; }
  S.note = "Payout recorded for " + payRef(bookingId) + "."; await loadPayments();
}

const when = d => d ? new Date(d).toLocaleString("en-IN",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}) : "—";
const statusChip = st => `<span class="chip ${st==='completed'||st==='matched'?'green':st==='cancelled'?'red':''}">${esc(st||'—')}</span>`;

const BK_STATUSES = [["all","All"],["pending_payment","Awaiting payment"],["confirmed","Confirmed"],["enroute","On the way"],["arrived","Arrived"],["shooting","Shooting"],["completed","Completed"],["cancelled","Cancelled"]];
const RQ_STATUSES = [["all","All"],["broadcasting","Open"],["awaiting","Awaiting"],["matched","Booked"],["expired","Expired"],["cancelled","Cancelled"]];
const textHit = (o, q) => !q || Object.values(o).some(v => v != null && String(v).toLowerCase().includes(q));
function bkList(){ const f = S.bkFilter || "all", q = (S.bkQ || "").trim().toLowerCase();
  return S.bookings.filter(b => (f === "all" || b.status === f) && textHit({ ...b, ref: payRef(b.id) }, q)); }
function rqList(){ const f = S.rqFilter || "all", q = (S.rqQ || "").trim().toLowerCase();
  return S.requests.filter(r => (f === "all" || r.status === f) && textHit(r, q)); }
function csvOf(name, cols, rows){
  const q = v => { v = v == null ? "" : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; };
  const blob = new Blob([cols.join(",") + "\n" + rows.map(r => cols.map(c => q(r[c])).join(",")).join("\n")], { type: "text/csv" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "snappro-" + name + "-" + istToday() + ".csv";
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

const CAT_NAMES = {portrait:"Portrait",event:"Party / Event",wedding:"Wedding",birthday:"Birthday",product:"Product",food:"Food",maternity:"Maternity",corporate:"Corporate",realestate:"Real estate",fashion:"Fashion",pet:"Pet",street:"Candid / Street"};
const emailOf = id => { const u = (S.users || []).find(x => x.id === id); return u ? u.email : ""; };
async function decide(id, status){
  const p = S.photographers.find(x => x.id === id); if(!p) return;
  S.err = ""; S.note = "";
  let note = null;
  if(status === "rejected"){
    const box = el("rejWhy-" + id); note = box ? box.value.trim() : "";
    if(note.length < 5){ S.err = "Write a short reason so " + (p.display_name || "they") + " knows what to fix."; render(); return; }
  } else if(!confirm("Approve " + (p.display_name || "this photographer") + "? Customers will be able to see and book them straight away.")) return;
  S.busyId = id; render();
  const { error } = await sb.rpc("set_photographer_approval", { p_id: id, p_status: status, p_note: note });
  S.busyId = null;
  if(error){ S.err = "Couldn't update: " + error.message; render(); return; }
  S.rejecting = null;
  S.note = status === "approved" ? (p.display_name + " is approved and has been emailed.") : (p.display_name + " wasn't approved. They've been emailed your reason.");
  await loadData();
  if(S.me.role !== "manager") loadUsers(true);
}
function pendingCard(p, canDecide){
  const photos = p.portfolio || [], cats = (p.categories || []).map(c => CAT_NAMES[c] || c).join(", ");
  const flags = [];
  if(photos.length < 6) flags.push(photos.length ? "Only " + photos.length + " portfolio photo" + (photos.length === 1 ? "" : "s") : "No portfolio photos yet");
  if(!p.bio || p.bio.trim().length < 20) flags.push("Bio is empty or very short");
  if(!p.city) flags.push("No city");
  const em = emailOf(p.id);
  return `<div class="card pcard">
    <div class="between" style="align-items:flex-start;flex-wrap:wrap;gap:10px">
      <div>
        <div class="h2">${esc(p.display_name || "—")}</div>
        <div class="xs muted2 mt8">${em ? esc(em) + " · " : ""}${esc([p.city, p.state, p.pincode].filter(Boolean).join(", ") || "No location")}</div>
        <div class="xs muted2">${cats ? esc(cats) + " · " : ""}${p.years_exp || 0} yrs experience · ${p.approval_status === "pending" ? "sent for review " + ago(p.submitted_at || p.created_at) : "joined " + fmt(p.created_at)}</div>
      </div>
      ${p.approval_status === "rejected" ? `<span class="chip red">Not approved</span>` : `<span class="chip amber">Waiting</span>`}
    </div>
    ${p.approval_status === "rejected" && p.review_note ? `<div class="xs mt12" style="color:#ff8f9b">Reason sent: ${esc(p.review_note)}</div>` : ""}
    ${p.bio ? `<p class="sm muted mt12" style="white-space:pre-wrap;margin-bottom:0">${esc(p.bio)}</p>` : ""}
    ${photos.length ? `<div class="thumbs mt12">${photos.slice(0, 12).map(u => `<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="" loading="lazy"></a>`).join("")}</div>` : ""}
    ${flags.length ? `<div class="xs mt12" style="color:#ffd88a">Worth checking: ${flags.map(esc).join(" · ")}</div>` : ""}
    ${canDecide ? (S.rejecting === p.id ? `
      <div class="mt12"><textarea id="rejWhy-${p.id}" class="input" rows="2" maxlength="500" placeholder="What should they fix? e.g. Please add at least 6 photos of your own work."></textarea>
        <div class="row mt8"><button class="btn sm danger" ${S.busyId===p.id?'disabled':''} onclick="decide('${p.id}','rejected')">Send and don't approve</button>
        <button class="btn sm" onclick="S.rejecting=null;render()">Cancel</button></div></div>`
      : `<div class="row mt16">
        <button class="btn sm primary" ${S.busyId===p.id?'disabled':''} onclick="decide('${p.id}','approved')">${S.busyId===p.id?'Saving…':'Approve'}</button>
        ${p.approval_status === "pending" ? `<button class="btn sm danger" onclick="S.rejecting='${p.id}';S.err='';render();setTimeout(()=>{const t=el('rejWhy-${p.id}');if(t)t.focus()},0)">Don't approve…</button>` : ""}
      </div>`) : ""}
  </div>`;
}
function vPros(){
  const canDecide = S.me.role !== "manager";
  const all = S.photographers || [];
  const pending = all.filter(p => p.approval_status === "pending").sort((a,b) => Date.parse(a.submitted_at||a.created_at) - Date.parse(b.submitted_at||b.created_at));
  const rejected = all.filter(p => p.approval_status === "rejected");
  const live = all.filter(p => p.approval_status === "approved");
  return `
  <div class="sec">Waiting for approval (${pending.length})</div>
  ${pending.length ? `<div class="stackc">${pending.map(p => pendingCard(p, canDecide)).join("")}</div>`
    : `<div class="card"><div class="xs muted2">Nobody is waiting. New photographers appear here as soon as they finish signing up, and they can't see requests or send quotes until someone approves them.</div></div>`}
  ${!canDecide && pending.length ? `<div class="xs muted2 mt8">An admin or super admin needs to approve photographers.</div>` : ""}
  ${rejected.length ? `<details class="mt16"><summary class="sec" style="cursor:pointer">Not approved (${rejected.length})</summary><div class="stackc mt8">${rejected.map(p => pendingCard(p, canDecide)).join("")}</div></details>` : ""}

  <div class="sec mt24">Approved (${live.length})</div>
  ${!live.length ? `<div class="card"><div class="empty">No approved photographers yet.</div></div>` : `<div class="card tblwrap"><table>
    <thead><tr><th>Name</th><th>City</th><th>Rating</th><th>Shoots</th><th>Photos</th><th>Status</th><th>Verified</th></tr></thead>
    <tbody>${live.map(p=>`<tr>
      <td style="font-weight:600">${esc(p.display_name||'—')}<div class="xs muted2">${emailOf(p.id) ? esc(emailOf(p.id)) + " · " : ""}approved ${fmt(p.approved_at || p.created_at)}</div></td>
      <td class="muted">${esc(p.city||'—')}${p.state?', '+esc(p.state):''}</td>
      <td>${p.review_count ? Number(p.rating).toFixed(1)+'★ <span class="muted2">('+p.review_count+')</span>' : '<span class="muted2">No reviews</span>'}</td>
      <td>${p.jobs_done||0}</td><td>${(p.portfolio||[]).length}</td>
      <td><span class="chip ${p.is_online?'green':''}">${p.is_online?'Available':'Away'}</span></td>
      <td>${canDecide ? `<label class="sw"><input type="checkbox" ${p.is_verified?'checked':''} onchange="setVerified('${p.id}',this.checked)">${p.is_verified?'Verified':'No'}</label>`

}
let drillSeq = 0;
async function openDrill(kind, title, arg, allTime){
  const r = allTime ? { from: "2000-01-01", to: istToday(), label: "All time" } : periodRange(), seq = ++drillSeq;
  S.drill = { kind, title, arg: arg == null || arg === "" ? null : arg, rows: null, q: "", err: "", sub: allTime || !PERIOD_KINDS.has(kind) ? "All time / right now" : r.label };

const COL_LABEL = { shoot_time:"Shoot time", booked_at:"Booked", posted:"Posted", sent:"Sent", at:"When", joined:"Joined", last_sign_in:"Last sign-in",
  first_at:"First visit", last_at:"Last visit", photographer_share:"Photographer share", first_quote_min:"First quote (min)", minutes_after_post:"Min after post",

  approved_at:"Approved", last_message:"Last message", from_customer:"From customer", from_photographer:"From photographer", cancelled_by:"Cancelled by",
  cancelled_from:"Cancelled at stage", started_by:"Started by", first_day:"First day", last_day:"Last day", order_id:"Our ref" };
const MONEY_COLS = /^(price|amount|commission|photographer_share|budget|booked_price|lowest_quote|earnings|paid_online|refunded|spent|value|earned)$/;
const HIDE_COLS = new Set(["id","booking_id"]);
function cellHtml(k, v){
  if(v == null || v === "") return `<span class="muted2">—</span>`;
  if(typeof v === "boolean") return v ? "Yes" : "No";
  if(MONEY_COLS.test(k)) return inr(v);
  if(/(_at|^at|time|posted|sent|joined|closes|last_sign_in|last_message|^day|_day)$/.test(k) && /^\d{4}-\d\d-\d\d/.test(String(v)))
    return String(v).length === 10 ? fmt(v) : when(v);
  if(k === "category") return esc(CAT_NAMES[v] || v);
  if(k === "method") return esc(methodName(v));
  if(k === "status" || k === "payment" || k === "balance" || k === "payout" || k === "refund" || k === "approval" || k === "outcome") return `<span class="chip">${esc(String(v).replace(/_/g," "))}</span>`;
  if(k === "stars" || k === "rating") return esc(v) + "★";
  return esc(v);
}
function drillRows(){
  const d = S.drill, q = (d.q || "").trim().toLowerCase();

/* the database returns rows as JSON objects (no column order), so order them here */
const COL_ORDER = ["shoot_time","booked_at","posted","sent","at","requested","done","day","first_at","last_at","first_day","last_day","joined",
  "name","customer","photographer","signed_in_as","role","email","phone","category","shoot_types","city","state","pincode","hours","stage",

  "minutes_after_post","requests","bookings","paid_online","jobs_done","rating","reviews","stars","comment","photos","earnings","messages",
  "from_customer","from_photographer","last_message","views","days","device","path","referrer","cancelled_by","cancelled_from","reason",
  "started_by","closes","last_sign_in","email_confirmed","approved_at","razorpay_id","razorpay_refund","arn","order_id","environment","note"];
const colRank = k => { const i = COL_ORDER.indexOf(k); return i < 0 ? 999 : i; };
function drillCols(){ const first = (S.drill.rows || [])[0]; return first ? Object.keys(first).filter(k => !HIDE_COLS.has(k)).sort((a, b) => colRank(a) - colRank(b)) : []; }
function drillBodyHtml(){

  }).join("") + (rows.length > 500 ? `<tr><td colspan="${cols.length}" class="xs muted2">Showing 500 of ${rows.length} — download the CSV for all.</td></tr>` : "");
}
function drillSearch(v){ S.drill.q = v; setHtml("drillBody", drillBodyHtml()); setHtml("drillCount", drillCountText()); }
function drillCountText(){ const n = drillRows().length; return n + (n === 1 ? " row" : " rows"); }
function exportDrill(){
  const cols = drillCols(), rows = drillRows();
  const q = v => { v = v == null ? "" : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; };
  const blob = new Blob([cols.join(",") + "\n" + rows.map(r => cols.map(c => q(r[c])).join(",")).join("\n")], { type: "text/csv" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "snappro-" + S.drill.kind + "-" + istToday() + ".csv";
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);

}

    <div class="card"><div class="sec">When shoots are wanted — day of week</div><div class="chart-box"><canvas id="chWeekday"></canvas></div></div>
    <div class="card"><div class="sec">How fast the first quote arrives</div><div class="chart-box"><canvas id="chSpeed"></canvas></div></div>
    <div class="card"><div class="sec">Ratings given</div><div class="chart-box"><canvas id="chRatings"></canvas></div><div class="xs muted2">Tap a bar to read those reviews</div></div>
  </div>

  <div class="grid2 mt16">
    ${rowsTable("Shoot types", ["Type","Requests","Quoted","Booked","Avg budget"].concat(money ? ["Value"] : []),
      (R.categories || []).map(c => ({ c, cells: [esc(CAT_NAMES[c.category] || c.category || "—"), num(c.requests), num(c.quoted), num(c.booked), inr(c.avg_budget)].concat(money ? [inr(c.value)] : []) })),
      x => `openDrill('category','Requests',${JSON.stringify(x.c.category || "").replace(/"/g, "&quot;")})`)}
    ${rowsTable("Cities — demand vs photographers", ["City","Requests","Booked","No quote","Photographers"].concat(money ? ["Value"] : []),
      (R.cities || []).map(c => ({ c, cells: [esc(c.city), num(c.requests), num(c.booked), c.no_quote ? `<span style="color:#ffd88a">${num(c.no_quote)}</span>` : "0", c.photographers ? num(c.photographers) : `<span style="color:#ff8f9b">0</span>`].concat(money ? [inr(c.value)] : []) })),
      x => `openDrill('city','Requests',${JSON.stringify(x.c.city || "").replace(/"/g, "&quot;")})`)}
    ${rowsTable("Top photographers", ["Name","City","Quotes","Booked","Completed"].concat(money ? ["Earned"] : []).concat(["Rating"]),
      (R.top_photographers || []).map(p => ({ p, cells: [esc(p.name), esc(p.city || "—"), num(p.quotes), num(p.booked), num(p.completed)].concat(money ? [inr(p.earned)] : []).concat([p.reviews ? Number(p.rating).toFixed(1) + "★ (" + p.reviews + ")" : "—"]) })),
      x => `openDrill('pgs_city','Photographers',${JSON.stringify(x.p.city || "").replace(/"/g, "&quot;")})`)}
    ${money ? rowsTable("Top customers", ["Name","Bookings","Spent"], (R.top_customers || []).map(c => ({ cells: [esc(c.name || "—"), num(c.bookings), inr(c.spent)] })), () => `openDrill('top_customers','Customers')`) : ""}
    ${rowsTable("Cancellations", ["Cancelled by","At stage","Count"], (R.cancellations || []).map(c => ({ cells: [esc(c.by), esc(String(c.stage).replace(/_/g," ")), num(c.n)] })), () => `openDrill('cancelled','Cancelled bookings')`)}
    <div class="card"><div class="sec">Prices</div>
      <div class="kvr"><span class="muted2">Average customer budget</span><span>${inr(P.avg_budget)}</span></div>
      <div class="kvr"><span class="muted2">Average quote</span><span>${inr(P.avg_quote)}</span></div>
      ${money ? `<div class="kvr"><span class="muted2">Average booked price</span><span>${inr(P.avg_booked)}</span></div>` : ""}
      <div class="kvr"><span class="muted2">Quotes above the customer's budget</span><span>${num(P.quotes_over_budget)} of ${num(P.quotes)} (${pct(P.quotes_over_budget, P.quotes)})</span></div>
      <button class="linkbtn mt8" onclick="openDrill('quotes','All quotes')">See every quote ›</button></div>
    ${rowsTable("Most viewed pages", ["Page","Views"], (R.pages || []).map(p => ({ cells: [esc(p.path), num(p.n)] })), () => `openDrill('visitors','Visits')`)}
  </div>`;
}
let reportCharts = [];
function drawReportCharts(){
  reportCharts.forEach(c => { try{ c.destroy(); }catch(e){} }); reportCharts = [];
  if(S.view !== "console" || S.tab !== "overview" || !window.Chart || !S.report || S.drill || S.bk) return;
  const R = S.report, b = periodRange().bucket, grid = "rgba(255,255,255,.06)", tick = "#8b8b9e";
  const axes = (m) => ({ x: { grid: { color: grid }, ticks: { color: tick, maxRotation: 0, autoSkip: true, maxTicksLimit: 12 } },
                         y: { beginAtZero: true, grid: { color: grid }, ticks: m ? { color: tick, callback: v => inr(v) } : { color: tick, precision: 0 } } });
  const legend = { labels: { color: "#c9c9d6", boxWidth: 12, font: { size: 11 } } };
  const mk = (id, cfg) => { const c = el(id); if(c) reportCharts.push(new Chart(c, cfg)); };
  const pie = (id, labels, data, onPick) => mk(id, { type: "doughnut", data: { labels, datasets: [{ data, borderWidth: 0,
      backgroundColor: ["#ff5a1f","#4d8dff","#28c76f","#a67cff","#ffc857","#ff4d5e","#5fd3e0","#8b8b9e"] }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: "right", labels: legend.labels } },
      onClick: (e, els) => { if(els.length) onPick(els[0].index); } } });
  const bars = (id, labels, data, label, color, onPick) => mk(id, { type: "bar", data: { labels, datasets: [{ label, data, backgroundColor: color, borderRadius: 4 }] },
    options: { responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { display: false } }, scales: axes(false),
      onClick: onPick ? (e, els) => { if(els.length) onPick(els[0].index); } : undefined } });
  if(R.money_series){
    const s = R.money_series;
    mk("chMoney", { type: "bar", data: { labels: s.map(x => bucketLabel(x.bucket, b)), datasets: [
      { label: "Collected", data: s.map(x => Number(x.collected)), backgroundColor: "rgba(77,141,255,.6)", borderRadius: 3 },
      { label: "Commission", data: s.map(x => Number(x.commission)), backgroundColor: "rgba(40,199,111,.65)", borderRadius: 3 },
      { label: "Refunded", data: s.map(x => Number(x.refunded)), backgroundColor: "rgba(255,77,94,.55)", borderRadius: 3 },
      { label: "Paid to photographers", data: s.map(x => Number(x.paid_out)), backgroundColor: "rgba(166,124,255,.6)", borderRadius: 3 } ] },
      options: { responsive: true, maintainAspectRatio: false, animation: false, interaction: { mode: "index", intersect: false },
        plugins: { legend, tooltip: { callbacks: { label: c => c.dataset.label + ": " + inr(c.parsed.y) } } }, scales: axes(true) } });
  }
  const st = R.by_status || [];
  pie("chStatus", st.map(x => x.status === "pending_payment" ? "awaiting payment" : x.status), st.map(x => x.n), i => openDrill("status", "Bookings", st[i].status));
  if(R.methods){ const m = R.methods; pie("chMethods", m.map(x => methodName(x.method)), m.map(x => Number(x.amount)), i => openDrill("method", "Payments", m[i].method)); }
  const dv = R.devices || []; pie("chDevices", dv.map(x => x.device), dv.map(x => x.n), i => openDrill("device", "Visits", dv[i].device));
  const hrs = Array.from({ length: 24 }, (_, h) => ((R.by_hour || []).find(x => x.h === h) || {}).n || 0);
  bars("chHour", hrs.map((_, h) => (h % 12 || 12) + (h < 12 ? "am" : "pm")), hrs, "Shoots", "rgba(255,90,31,.6)");
  const wd = [1,2,3,4,5,6,7].map(d => ((R.by_weekday || []).find(x => x.d === d) || {}).n || 0);
  bars("chWeekday", WEEKDAYS, wd, "Shoots", "rgba(77,141,255,.6)");
  const sp = R.quote_speed || []; bars("chSpeed", sp.map(x => x.label), sp.map(x => x.n), "Requests", "rgba(40,199,111,.6)");
  const rt = [5,4,3,2,1].map(s => ((R.ratings || []).find(x => x.stars === s) || {}).n || 0);
  bars("chRatings", ["5★","4★","3★","2★","1★"], rt, "Reviews", "rgba(255,200,87,.7)", i => openDrill("reviews", "Reviews", String(5 - i)));
}

/* ============================ render ========================== */

function render(){
  const app = el("app");
  const focus = document.activeElement;
  const fid = focus && focus.id ? focus.id : null;
  const caret = fid && focus.setSelectionRange ? focus.selectionStart : null;

  app.innerHTML =
    S.view==="login"   ? vLogin()   :
    S.view==="setup"   ? vSetup()   :
    S.view==="reset"   ? vReset()   :
    S.view==="newpw"   ? vNewPw()   :
    S.view==="code"    ? vCode()    :
    S.view==="denied"  ? vDenied()  :
    S.view==="console" ? vConsole() + vDrill() + vBooking() : vLogin();

  try{ drawCharts(); }catch(e){ console.warn('charts', e); }
  try{ drawReportCharts(); }catch(e){ console.warn('report charts', e); }
  if(fid){
    const n = el(fid);
    if(n){ n.focus(); if(caret!=null && n.setSelectionRange){ try{ n.setSelectionRange(caret,caret); }catch(e){} } }
  }
}

window.addEventListener("error", e => console.error("Admin:", e.message));
document.addEventListener("keydown", e => { if(e.key === "Escape" && (S.bk || S.drill)){ if(S.bk) S.bk = null; else S.drill = null; render(); } });
boot();
</script>
