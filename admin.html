<style>
:root{
  --bg:#0a0a0f; --surface:#14141c; --surface-2:#1c1c26; --surface-3:#252533;
  --border:#2b2b3a; --border-soft:#22222e; --text:#f4f4f7; --muted:#8b8b9e; --muted-2:#61617a;
  --accent:#ff5a1f; --accent-soft:rgba(255,90,31,.14);
  --green:#28c76f; --red:#ff4d5e; --blue:#4d8dff; --purple:#a67cff;
  --r:14px; --ff:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:
  radial-gradient(900px 600px at 85% -10%,rgba(255,90,31,.10),transparent 60%),
  radial-gradient(800px 500px at 5% 110%,rgba(166,124,255,.10),transparent 60%),var(--bg);
  color:var(--text);font-family:var(--ff);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 60px}
.center-card{max-width:400px;margin:8vh auto;padding:0 20px}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:26px}
.mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--accent),#ff8a3d);
  display:grid;place-items:center;box-shadow:0 8px 22px -6px rgba(255,90,31,.6)}
.bname{font-weight:800;font-size:19px;letter-spacing:-.5px}
.btag{font-size:11px;color:var(--muted-2);margin-top:-2px}
.card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--r);padding:16px}
.h1{font-size:23px;font-weight:800;letter-spacing:-.7px}
.h2{font-size:17px;font-weight:750;letter-spacing:-.3px}
.sm{font-size:13px}.xs{font-size:11.5px}
.muted{color:var(--muted)}.muted2{color:var(--muted-2)}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grow{flex:1;min-width:0}
.sec{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted-2);font-weight:700;margin-bottom:10px}
.input{width:100%;padding:12px 14px;border-radius:12px;background:var(--surface);
  border:1px solid var(--border);outline:none;transition:.15s}
.input:focus{border-color:var(--accent);background:var(--surface-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;
  border-radius:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--border);transition:.15s}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:linear-gradient(135deg,var(--accent),#ff7a3d);border-color:transparent;color:#fff}
.btn.danger{border-color:rgba(255,77,94,.4);color:var(--red)}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--border);font-size:11px;font-weight:700;color:var(--muted)}
.chip.super{background:rgba(255,90,31,.15);border-color:rgba(255,90,31,.4);color:#ffab86}
.chip.admin{background:rgba(77,141,255,.15);border-color:rgba(77,141,255,.4);color:#8fb6ff}
.chip.manager{background:rgba(166,124,255,.15);border-color:rgba(166,124,255,.4);color:#c4a6ff}
.chip.green{background:rgba(40,199,111,.14);border-color:rgba(40,199,111,.35);color:#5fe0a0}
.chip.red{background:rgba(255,77,94,.14);border-color:rgba(255,77,94,.35);color:#ff8f9b}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--r);padding:14px}
.stat .v{font-size:22px;font-weight:800;letter-spacing:-.6px}
.stat .l{font-size:11px;color:var(--muted-2);font-weight:600;margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted-2);font-weight:700;font-size:10px;letter-spacing:.8px;
  text-transform:uppercase;padding:9px 8px;border-bottom:1px solid var(--border)}
td{padding:11px 8px;border-bottom:1px solid var(--border-soft);vertical-align:middle}
.tabs{display:flex;gap:6px;background:var(--surface);padding:4px;border-radius:13px;border:1px solid var(--border-soft)}
.tab{padding:8px 16px;border-radius:10px;font-size:13.5px;font-weight:700;color:var(--muted-2)}
.tab.on{background:var(--surface-3);color:var(--text)}
.otp{display:flex;gap:7px;justify-content:center;margin:18px 0}
.otp i{width:44px;height:54px;border-radius:12px;display:grid;place-items:center;font-size:21px;
  font-weight:800;font-style:normal;background:var(--surface);border:1.5px solid var(--border)}
.otp i.on{border-color:var(--accent)}
.err{color:var(--red);font-size:12.5px;margin-top:10px}
.ok{color:var(--green);font-size:12.5px;margin-top:10px}
.warn{background:rgba(255,200,87,.1);border:1px solid rgba(255,200,87,.35);color:#ffd88a;border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.5}
.chip.amber{background:rgba(255,200,87,.12);border-color:rgba(255,200,87,.35);color:#ffd88a}
.tblwrap{overflow-x:auto}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
.sw input{accent-color:var(--green);width:16px;height:16px}
.empty{text-align:center;padding:40px 20px;color:var(--muted-2)}
.wrap{max-width:1240px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.chart-box{position:relative;height:280px;margin-top:10px}
.stat.hl{border-color:rgba(255,90,31,.35);background:linear-gradient(145deg,rgba(255,90,31,.12),var(--surface))}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(40,199,111,.6);animation:live 2s infinite}
@keyframes live{0%{box-shadow:0 0 0 0 rgba(40,199,111,.6)}70%{box-shadow:0 0 0 8px rgba(40,199,111,0)}100%{box-shadow:0 0 0 0 rgba(40,199,111,0)}}
.tab{white-space:nowrap}
.tab .count{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px}
.stackc{display:flex;flex-direction:column;gap:12px}
.pcard{border-color:rgba(255,200,87,.3)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.thumbs img,.thumbs video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;display:block;background:var(--surface-2)}
.linkbtn{color:var(--accent);font-weight:700;font-size:12.5px}
details>summary{list-style:none}details>summary::-webkit-details-marker{display:none}
.spin{width:44px;height:44px;margin:0 auto;border-radius:50%;border:3px solid var(--surface-3);
  border-top-color:var(--accent);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pw-wrap{position:relative}
.pw-wrap .input{padding-right:66px}
.pw-eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:700;color:var(--muted);padding:6px 9px;border-radius:8px}
.pw-eye:hover{color:var(--text);background:var(--surface-2)}
.pw-rules{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;margin-top:9px}
.pw-rule{font-size:11.5px;color:var(--muted-2);font-weight:600}
.pw-rule.ok{color:var(--green)} .pw-rule.bad{color:var(--red)}
.input.pw-bad{border-color:var(--red)!important}
.pw-flash{animation:pwFlash .8s ease}
@keyframes pwFlash{0%,100%{transform:translateX(0);box-shadow:none}
  15%,45%,75%{transform:translateX(-6px);box-shadow:0 0 0 3px rgba(255,77,94,.5)}
  30%,60%,90%{transform:translateX(6px);box-shadow:0 0 0 3px rgba(255,77,94,.5)}}
.pw-flash-text{animation:pwText .8s ease}
@keyframes pwText{0%,100%{opacity:1}25%,75%{opacity:.2}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.pw-flash,.pw-flash-text{animation:none}}
.field{margin-top:12px}.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px}
.linkbtn{font-size:12px;font-weight:700;color:var(--accent)}
/* clickable tiles, drill-down sheet, reports */
button.stat{text-align:left;width:100%;font:inherit;color:inherit;cursor:pointer;transition:border-color .15s,transform .15s}
button.stat:hover{border-color:rgba(255,90,31,.45)}
button.stat:active{transform:scale(.985)}
.stat .go{color:var(--accent);font-weight:800;margin-left:2px}
.sheet-bg{position:fixed;inset:0;background:rgba(5,5,10,.72);backdrop-filter:blur(3px);z-index:50;display:flex;justify-content:center;align-items:flex-start;padding:4vh 14px;overflow-y:auto}
.sheet-bg.top{z-index:60}
.sheet{width:100%;max-width:1180px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;box-shadow:0 30px 80px -20px rgba(0,0,0,.7)}
.sheet.narrow{max-width:900px}
.rowlink{cursor:pointer}.rowlink:hover td{background:var(--surface-2)}
.kvr{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid var(--border-soft);font-size:13px}
.kvr>span:last-child{text-align:right}
.chart-box.sm{height:220px}
.funnel{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.fstep{display:grid;grid-template-columns:190px 1fr 130px;align-items:center;gap:12px;padding:6px 8px;border-radius:9px;text-align:left}
.fstep:hover{background:var(--surface-2)}
.flabel{font-size:13px;font-weight:600}
.fbar{height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.fbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#ff8a3d);border-radius:6px}
.fnum{font-size:13px;font-weight:700;text-align:right}
td{white-space:nowrap}
.miniclick tr{cursor:pointer}.miniclick tr:hover td{background:var(--surface-2)}
@media (max-width:640px){.fstep{grid-template-columns:1fr 80px}.fbar{grid-column:1/-1;grid-row:2}}
/* offers tab */
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.preset{text-align:left;padding:16px;border-radius:14px;color:#fff;position:relative;min-height:128px;background:linear-gradient(135deg,#ff5a1f,#ff8a3d);box-shadow:0 10px 26px -14px rgba(255,90,31,.7);transition:transform .15s}
.preset:hover{transform:translateY(-2px)}
.preset.k-booking_pct{background:linear-gradient(135deg,#e2426b,#ff7a59)}
.preset.k-storage_bonus{background:linear-gradient(135deg,#2f6fe0,#5aa2ff)}
.preset.k-commission_cut{background:linear-gradient(135deg,#169b5a,#3fd18a)}
.preset.k-featured{background:linear-gradient(135deg,#b07d11,#f2c14e)}
.preset.k-storage_discount{background:linear-gradient(135deg,#7a4fd6,#a67cff)}
.preset .pb{font-size:10px;font-weight:900;letter-spacing:1px;background:rgba(255,255,255,.95);color:#111;border-radius:6px;padding:3px 7px}
.preset .pt{font-weight:800;font-size:15px;margin-top:10px;line-height:1.3}
.preset .pd{font-size:11.5px;opacity:.9;margin-top:6px;line-height:1.4}
.ofg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.ofl{display:block;font-size:11.5px;font-weight:700;color:var(--muted)}
.ofl .input{margin-top:5px;padding:9px 11px}
.offer-row.dim{opacity:.6}
.refbox{border:1px solid var(--border-soft);border-radius:12px;padding:14px}
.kycbox{border:1px solid rgba(77,141,255,.35);background:rgba(77,141,255,.06);border-radius:12px;padding:12px;font-size:13px}
.kycbox.none{border-color:var(--border-soft);background:none;color:var(--muted)}
.kimgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.kimg{position:relative;display:block;border-radius:8px;overflow:hidden;background:var(--surface-2);aspect-ratio:4/3;text-decoration:none}
.kimg img{width:100%;height:100%;object-fit:cover;display:block}
.kimg span{display:grid;place-items:center;height:100%;color:var(--muted-2);font-size:12px}
.kimg i{position:absolute;left:6px;bottom:6px;font-style:normal;font-size:11px;font-weight:700;background:rgba(0,0,0,.65);color:#fff;border-radius:5px;padding:2px 6px}
.chatlog{display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow-y:auto;padding:4px}
.cl{max-width:78%;padding:9px 12px;border-radius:12px;background:var(--surface-2)}
.cl.photographer{align-self:flex-end;background:rgba(255,90,31,.14)}
.cl-who{font-size:11px;color:var(--muted-2);font-weight:700;margin-bottom:3px}
.cl-text{font-size:13.5px;white-space:pre-wrap;word-break:break-word}

/* departments */
.wrap{max-width:1320px}
.tabgroup{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tglabel{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted-2);font-weight:800;min-width:92px}
.cnt{font-size:11px;color:var(--muted);letter-spacing:0;text-transform:none;margin-left:6px;font-weight:600}
table.dt td,table.dt th{white-space:nowrap}
table.dt td{max-width:340px;overflow:hidden;text-overflow:ellipsis}
th.sortable{cursor:pointer;user-select:none}th.sortable:hover{color:var(--text)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
a.lnk{color:var(--text);font-weight:650;cursor:pointer;text-decoration:underline;text-decoration-color:rgba(255,255,255,.25);text-underline-offset:3px}
a.lnk:hover{color:var(--accent)}
table.heat{border-collapse:separate;border-spacing:2px;font-size:11px}
table.heat td,table.heat th{padding:5px 4px;text-align:center;border:0;min-width:26px;border-radius:4px}
table.heat th{color:var(--muted-2);font-weight:700}
.tl{max-height:none}
.tlrow{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-soft);font-size:13.5px}
.tlrow:last-child{border-bottom:0}
.tlt{flex:0 0 150px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;padding-top:1px}
.tldot{flex:0 0 9px;height:9px;border-radius:50%;margin-top:5px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid var(--border-soft);font-size:13px}
.kv:last-child{border-bottom:0}.kv span:first-child{color:var(--muted);flex:0 0 auto}.kv span:last-child{text-align:right;word-break:break-word}
.sheet.wide{max-width:1240px}
details.u3{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:12px;padding:10px 14px;margin-top:10px}
details.u3 summary{cursor:pointer;font-weight:750;font-size:14px}
.lbgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.lbgrid label{display:block}.lbgrid .input{margin-top:5px}
@media(max-width:700px){.tlt{flex-basis:96px}.tglabel{min-width:0}}
</style>

<body>
<div id="app"><div class="center-card"><div class="spin" style="margin-top:20vh"></div></div></div>

<script>
"use strict";

const SUPABASE_URL = "https://eafudrjxjtenqoorjzsc.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_n8ub8dzUbfa5uJqA_PHDXw_QLJJINCd";

const ROLES = [
  {id:"super_admin", label:"Super admin", desc:"Everything, including managing staff"},
  {id:"admin",       label:"Admin",       desc:"All operations data and customer details"},
  {id:"manager",     label:"Manager",     desc:"Bookings and requests only"}
];
const roleLabel = r => (ROLES.find(x=>x.id===r)||{label:r}).label;

let sb = null;
const S = {
  view: "login",
  email: "", otp: "", busy: false, err: "", note: "",
  me: null,              // staff row
  tab: "overview",
  stats: null, staff: [], invites: [], bookings: [], requests: [], photographers: [],
  emailReady: null, emailStatus: {},
  period: { mode: "day", from: "", to: "" }, insights: null, insightErr: "", insightBusy: false, updatedAt: null,
  users: null, usersErr: "", usersFilter: "all", usersQ: "",
  inviteEmail: "", inviteRole: "manager"
};

const el = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr = n => "₹"+Math.round(n||0).toLocaleString("en-IN");
const fmt = d => d ? new Date(d).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}) : "—";

function camIcon(size,color){
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>`;
}
const brand = `<div class="brand"><div class="mark">${camIcon(21,"#fff")}</div>
  <div><div class="bname">SnapPro</div><div class="btag">Operations console</div></div></div>`;

/* ============================ auth ============================ */

/* Password kept out of S so it is never rendered back into logs or state dumps. */
var PW = { pw:"", pw2:"", show:false, touched:false, flash:false };
function pwReset(){ PW = { pw:"", pw2:"", show:false, touched:false, flash:false }; }
function pwRules(p){
  p = p || "";
  return [
    { ok: p.length >= 8,   t: "At least 8 characters" },
    { ok: /[a-z]/.test(p), t: "One lowercase letter" },
    { ok: /[A-Z]/.test(p), t: "One uppercase letter" },
    { ok: /[0-9]/.test(p), t: "One number" }
  ];
}
function pwStrong(){ return pwRules(PW.pw).every(r => r.ok); }
function pwBlock(needConfirm){
  const bad = !pwStrong() || (needConfirm && PW.pw !== PW.pw2);
  if(!bad) return false;
  PW.touched = true; PW.flash = true; render();
  setTimeout(()=>{ PW.flash = false; render(); }, 850);
  return true;
}
function pwFieldsHtml(label){
  const rules = pwRules(PW.pw);
  const live = PW.touched || PW.pw.length > 0;
  const weak = live && !rules.every(r => r.ok);
  const mism = (PW.touched || PW.pw2.length > 0) && PW.pw2 !== PW.pw;
  const type = PW.show ? "text" : "password";
  return `
  <div class="field"><label>${label}</label>
    <div class="pw-wrap">
      <input id="pw1" class="input ${weak?'pw-bad':''} ${PW.flash&&weak?'pw-flash':''}" type="${type}" autocomplete="new-password"
        placeholder="Create a strong password" value="${esc(PW.pw)}" oninput="pwInput('pw',this.value)">
      <button type="button" class="pw-eye" onclick="pwToggleShow()">${PW.show?'Hide':'Show'}</button>
    </div>
    <div class="pw-rules" id="pwRules">${pwRulesInner()}</div>
  </div>
  <div class="field"><label>Confirm password</label>
    <input id="pw2" class="input ${mism?'pw-bad':''} ${PW.flash&&mism?'pw-flash':''}" type="${type}" autocomplete="new-password"
      placeholder="Type it again" value="${esc(PW.pw2)}" oninput="pwInput('pw2',this.value)">
    <div id="pwMatch">${pwMatchInner()}</div>
  </div>`;
}
/* Typing must never rebuild the field being typed into: on phones a
   rebuilt field reopens the keyboard in its default layout. */
function setHtml(id, html){ const n = el(id); if(n) n.innerHTML = html; }
function setCls(id, cls, on){ const n = el(id); if(n) n.classList.toggle(cls, !!on); }
function clearErr(){ S.err = ""; document.querySelectorAll('#app .err').forEach(n => n.remove()); }
function pwRulesInner(){
  const live = PW.touched || PW.pw.length > 0;
  return pwRules(PW.pw).map(r=>`<div class="pw-rule ${r.ok?'ok':(live?'bad':'')} ${PW.flash&&!r.ok?'pw-flash-text':''}">${r.ok?'✓':(live?'✗':'•')} ${r.t}</div>`).join('');
}
function pwMatchInner(){
  const m = (PW.touched || PW.pw2.length > 0) && PW.pw2 !== PW.pw;
  if(m) return `<div class="xs mt8 ${PW.flash?'pw-flash-text':''}" style="color:var(--red)">✗ Passwords don't match</div>`;
  if(PW.pw2 && PW.pw2 === PW.pw) return `<div class="xs mt8" style="color:var(--green)">✓ Passwords match</div>`;
  return '';
}
function pwPaint(){

function otpInput(v){

function friendly(e){
  const m=(e&&e.message)||"", c=(e&&e.code)||"";
  if(c==="weak_password"||(/password/i.test(m)&&/weak|should|least|contain|characters/i.test(m))) return "That password doesn't meet the requirements.";
  if(/different from the old/i.test(m)) return "Choose a password you haven't used before.";
  if(/invalid login credentials/i.test(m)) return "Wrong email or password.";
  if(/email not confirmed/i.test(m)) return "Confirm your email first.";
  if(/signups not allowed|user not found/i.test(m)) return "There's no account with that email.";
  if(/rate limit|too many|security purposes/i.test(m)) return "Too many attempts. Wait a minute and try again.";
  if(/expired|invalid/i.test(m)&&/token|otp|code/i.test(m)) return "That code is wrong or has expired.";
  return m||"Something went wrong. Try again.";
}

async function loadMe(){
  S.busy = true; render();

  if(!u || !u.user){ S.busy=false; S.view="login"; render(); return; }

  try{ await sb.rpc('claim_staff_invite'); }catch(e){}

  const { data: row, error } = await sb.from('staff')
    .select('id,email,name,role,status').eq('id', u.user.id).maybeSingle();

  if(error){
    let m = friendly(error);

async function signUp(){

/* All dates are India time, whatever the computer's clock is set to. */
const IST_MS = 5.5 * 3600e3;
const istToday = () => new Date(Date.now() + IST_MS).toISOString().slice(0, 10);
const addDays = (d, n) => { const x = new Date(d + "T00:00:00Z"); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const dayDiff = (a, b) => Math.round((Date.parse(b + "T00:00:00Z") - Date.parse(a + "T00:00:00Z")) / 864e5);
const PERIODS = [["day","Daily"],["week","Weekly"],["month","Monthly"],["year","Yearly"],["custom","Custom"]];

function periodRange(){
  const p = S.period, t = istToday();
  if(p.mode === "day")  return { from: addDays(t, -29), to: t, bucket: "day",  label: "Last 30 days" };
  if(p.mode === "week"){ const dow = (new Date(t + "T00:00:00Z").getUTCDay() + 6) % 7;
                         return { from: addDays(addDays(t, -dow), -77), to: t, bucket: "week", label: "Last 12 weeks" }; }
  if(p.mode === "month"){ const [y, m] = t.split("-").map(Number); const d = new Date(Date.UTC(y, m - 12, 1));
                         return { from: d.toISOString().slice(0, 10), to: t, bucket: "month", label: "Last 12 months" }; }
  if(p.mode === "year") return { from: (Number(t.slice(0, 4)) - 4) + "-01-01", to: t, bucket: "year", label: "Last 5 years" };
  let from = p.from || addDays(t, -29), to = p.to || t;
  if(from > to){ const x = from; from = to; to = x; }
  const n = dayDiff(from, to);
  const bucket = n <= 62 ? "day" : n <= 182 ? "week" : n <= 1100 ? "month" : "year";
  return { from, to, bucket, label: fmtDay(from) + " – " + fmtDay(to) };
}
function fmtDay(d){ return new Date(d + "T00:00:00Z").toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" }); }
function bucketLabel(d, b){
  const x = new Date(String(d).slice(0, 10) + "T00:00:00Z"), o = { timeZone: "UTC" };
  if(b === "day")   return x.toLocaleDateString("en-IN", { ...o, day: "numeric", month: "short" });
  if(b === "week")  return "w/c " + x.toLocaleDateString("en-IN", { ...o, day: "numeric", month: "short" });
  if(b === "month") return x.toLocaleDateString("en-IN", { ...o, month: "short", year: "numeric" });
  return String(x.getUTCFullYear());
}

let insightSeq = 0;
async function loadInsights(quiet){
  const r = periodRange(), seq = ++insightSeq;
  if(!quiet){ S.insightErr = ""; S.insightBusy = true; render(); }
  const [se, kp] = await Promise.all([
    sb.rpc("admin_series", { p_from: r.from, p_to: r.to, p_bucket: r.bucket }),
    sb.rpc("admin_kpis",   { p_from: r.from, p_to: r.to })
  ]);
  if(seq !== insightSeq) return;                 // a newer period was picked meanwhile
  S.insightBusy = false;
  const err = (se && se.error) || (kp && kp.error);
  if(err){
    S.insightErr = /admin_series|admin_kpis|function/i.test(err.message)
      ? "Charts need the latest database update — run supabase/snappro.sql in the Supabase SQL Editor."
      : "Couldn't load charts: " + err.message;
    render(); return;
  }
  loadReport();
  const next = { series: se.data || [], kpis: kp.data || null, range: r };
  const changed = JSON.stringify(next) !== JSON.stringify(S.insights);
  S.insights = next; S.updatedAt = new Date();
  if(!quiet || changed) render(); else paintUpdated();
}
function setPeriod(mode){
  S.period.mode = mode; S.dept = {};
  if(mode === "custom" && !S.period.from){ S.period.to = istToday(); S.period.from = addDays(S.period.to, -89); }
  loadInsights();
}

function paintUpdated(){ const n = el("liveAt"); if(n && S.updatedAt) n.textContent = "updated " + S.updatedAt.toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit", second: "2-digit" }); }

    sb.from('bookings').select('id,customer_name,photographer_name,photographer_id,start_at,status,price,commission_amount,photographer_amount,payment_status,payout_status,payout_ref,payout_at,cancelled_from,cancelled_by,advance_amount,balance_amount,balance_status,customer_id').order('start_at',{ascending:false}).limit(1000),
    sb.from('refunds').select('id,refund_id,payment_id,order_id,amount,status,gateway_refund_id,refund_arn,reason,created_at,processed_at').order('created_at',{ascending:false}).limit(1000),
    sb.from('photographer_payout').select('id,upi_id,account_name'),

  ]);
  // storage plans (photographer portfolio space) — optional until the database update is run

    sb.from('photographer_storage').select('id,plan,quota_bytes,expires_at'),

  ]);
  S.storagePay = so.error ? null : { orders: so.data || [], plans: ps.data || [], config: sp && sp.data ? sp.data.value : null };
  const err = [p,b,r,po].find(x => x && x.error);
  if(err){
    S.payErr = /payments|refunds|photographer_payout|does not exist|schema cache/i.test(err.error.message)

const payRef = id => id ? "SP-" + String(id).slice(0,8).toUpperCase() : "—";

function payChip(p){

             active:["","Waiting"], created:["","Waiting"], expired:["","Expired"], terminated:["","Closed"]}[p.status] || ["",p.status];

async function payFn(body){

/* refund policy: 100%, except customer cancelling after the photographer set off → 50% */
function policyRefund(p){
  const b = S.pay.bookings.find(x => x.id === p.booking_id) || {};
  const left = Number(p.amount) - Number(p.refunded_amount || 0);
  if(p.is_duplicate || p.note) return { amount: left, why: p.note || "Duplicate payment" };
  if(b.status === "cancelled" && b.cancelled_by === "customer" && b.cancelled_from === "enroute")
    return { amount: Math.min(left, Math.round(Number(p.amount) / 2)), why: "Customer cancelled after the photographer set off — 50% per policy" };
  if(b.status === "cancelled") return { amount: left, why: (b.cancelled_by === "photographer" ? "Photographer cancelled" : "Customer cancelled before the photographer set off") + " — full refund" };
  return { amount: left, why: "" };
}
async function refundPayment(id){
  const p = S.pay.payments.find(x => x.id === id); if(!p) return;
  const left = Number(p.amount) - Number(p.refunded_amount || 0);
  const pol = policyRefund(p);
  const amt = prompt("Refund how much to the customer? (maximum " + inr(left) + ")" + (pol.why ? "\nPolicy: " + pol.why : ""), String(pol.amount));
  if(amt === null) return;
  const n = Math.round(Number(amt) * 100) / 100;
  if(!(n > 0) || n > left){ S.err = "Enter an amount between ₹1 and " + inr(left) + "."; render(); return; }
  const reason = prompt("Reason (the customer may see this on their bank statement)", p.is_duplicate ? "Duplicate payment" : "Booking cancelled");
  if(reason === null) return;
  if(!confirm("Refund " + inr(n) + " for booking " + payRef(p.booking_id) + "? This sends money back through Razorpay and can't be undone.")) return;
  S.err = ""; S.note = ""; S.busyId = id; render();
  try{ const r = await payFn({ action: "refund", payment_id: id, amount: n, reason }); S.note = "Refund of " + inr(n) + " started (" + (r.status || "pending") + "). Razorpay usually completes normal refunds in 5–7 working days."; }
  catch(e){ S.err = "Refund failed: " + e.message; }
  S.busyId = null; await loadPayments();
}
async function checkRefund(refundId, gatewayRefundId){
  S.err = ""; S.note = "";
  try{ const r = await payFn({ action: "refund_check", refund_id: refundId, gateway_refund_id: gatewayRefundId }); S.note = "Refund status: " + r.status; }
  catch(e){ S.err = "Couldn't check: " + e.message; }

}

function exportPayments(){
  const bk = id => (S.pay.bookings.find(b => b.id === id) || {});
  const cols = ["created_at","order_id","booking","customer","photographer","part","amount","commission","photographer_share","status","method","razorpay_payment_id","bank_reference","refund_status","refunded_amount","environment"];
  const q = v => { v = v == null ? "" : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; };
  const rows = S.pay.payments.filter(payMatches).map(p => [p.created_at, p.order_id, payRef(p.booking_id), bk(p.booking_id).customer_name, bk(p.booking_id).photographer_name,

const pgName = id => { const p = (S.photographers || []).find(x => x.id === id); return p ? p.display_name : "—"; };
function vStoragePlans(){
  const X = S.storagePay;
  if(!X) return `<div class="sec mt24">Portfolio storage plans</div><div class="warn">Storage plans need the latest database update — run supabase/snappro.sql in the Supabase SQL Editor.</div>`;
  const paid = X.orders.filter(o => o.status === "paid"), live = paid.filter(o => o.environment === "live");
  const now = Date.now(), active = X.plans.filter(p => p.plan !== "free" && Date.parse(p.expires_at) > now);
  const soon = active.filter(p => Date.parse(p.expires_at) - now < 14 * 864e5);
  const cfg = X.config || { free_mb: 250, plans: [] };
  const byPlan = id => active.filter(p => p.plan === id).length;
  return `<div class="sec mt24">Portfolio storage plans</div>
  <div class="grid">
    <div class="stat hl"><div class="v">${inr(paid.reduce((t,o) => t + Number(o.amount), 0))}</div><div class="l">Storage revenue${live.length !== paid.length ? " (incl. test)" : ""}</div></div>

    ${(cfg.plans || []).map(p => `<div class="stat"><div class="v">${num(byPlan(p.id))}</div><div class="l">${esc(p.name)} (${esc(p.gb)} GB · ${inr(p.price)}/yr)</div></div>`).join("")}

  </tbody></table></div>` : `<div class="card mt12"><div class="xs muted2">No storage plans bought yet.</div></div>`}
  ${S.me.role === "super_admin" ? `<div class="card mt12"><div class="sec">Plans and prices</div>
    <div class="row" style="flex-wrap:wrap;gap:10px"><label class="xs muted">Free storage (MB) <input id="spFree" class="input" type="number" min="10" style="width:110px;padding:8px 10px" value="${esc(cfg.free_mb)}"></label></div>
    ${(cfg.plans || []).map((p, i) => `<div class="row mt8" style="flex-wrap:wrap;gap:10px">
      <label class="xs muted">Name <input id="spName${i}" class="input" style="width:120px;padding:8px 10px" value="${esc(p.name)}"></label>
      <label class="xs muted">GB <input id="spGb${i}" class="input" type="number" min="1" step="0.5" style="width:90px;padding:8px 10px" value="${esc(p.gb)}"></label>
      <label class="xs muted">₹ per year <input id="spPrice${i}" class="input" type="number" min="1" style="width:110px;padding:8px 10px" value="${esc(p.price)}"></label>
      <span class="xs muted2">id: ${esc(p.id)}</span></div>`).join("")}
    <div class="row mt12"><button class="btn sm primary" onclick="saveStoragePlans()">Save plans</button>
      <button class="btn sm" onclick="purgeMedia()">Clean up expired files now</button></div>
    <div class="xs muted2 mt8">New prices apply to new purchases and renewals. Files hidden after a plan ends are deleted from S3 after 30 days; this runs automatically, the button just does it now.</div></div>` : ""}`;
}
async function saveStoragePlans(){
  const cfg = (S.storagePay && S.storagePay.config) || { plans: [] };
  const next = { free_mb: Number(el("spFree").value), plans: (cfg.plans || []).map((p, i) => ({ id: p.id, name: el("spName" + i).value.trim() || p.name,
                 gb: Number(el("spGb" + i).value), price: Math.round(Number(el("spPrice" + i).value)) })) };
  S.err = ""; S.note = "";
  const { error } = await sb.rpc("admin_set_storage_plans", { p: next });
  if(error){ S.err = error.message; render(); return; }
  S.note = "Storage plans saved."; await loadPayments();
}
async function purgeMedia(){
  S.err = ""; S.note = "";
  const { data, error } = await sb.functions.invoke("media", { body: { action: "purge" } });
  if(error){ let m = error.message; try{ const j = await error.context.json(); if(j && j.error) m = j.error; }catch(e){} S.err = "Couldn't clean up: " + m; render(); return; }
  S.note = "Deleted " + ((data && data.deleted) || 0) + " expired file(s) from storage."; render();
}

const textHit = (o, q) => !q || Object.values(o).some(v => v != null && String(v).toLowerCase().includes(q));
function bkList(){ const f = S.bkFilter || "all", q = (S.bkQ || "").trim().toLowerCase();

  return S.requests.filter(r => (f === "all" || r.status === f) && textHit(r, q)); }
function csvOf(name, cols, rows){
  const q = v => { v = v == null ? "" : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; };
  const blob = new Blob([cols.join(",") + "\n" + rows.map(r => cols.map(c => q(r[c])).join(",")).join("\n")], { type: "text/csv" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "snappro-" + name + "-" + istToday() + ".csv";
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

async function decide(id, status){
  const p = S.photographers.find(x => x.id === id); if(!p) return;
  S.err = ""; S.note = "";

/* --- suspend / block --- */
async function setUserStatus(id, status){
  const u = (S.users || []).find(x => x.id === id) || {};
  const who = (u.public_id ? u.public_id + " · " : "") + (u.name || u.email || "this account");
  let reason = null, days = null;
  if(status !== "active"){
    reason = prompt((status === "blocked" ? "Block " : "Suspend ") + who + "?\nReason (they'll see this):", "");
    if(reason === null) return;
    if(status === "suspended"){ const d = prompt("For how many days? Leave empty until you restore it.", "7"); if(d === null) return; days = d.trim() === "" ? null : Math.max(1, parseInt(d, 10) || 0) || null; }
  } else if(!confirm("Restore " + who + "? They can use SnapPro normally again.")) return;
  S.err = ""; S.note = "";
  const { error } = await sb.rpc("admin_set_user_status", { p_user: id, p_status: status, p_reason: reason, p_days: days });
  if(error){ S.err = error.message; render(); return; }
  S.note = status === "active" ? "Account restored." : status === "blocked" ? "Account blocked." : "Account suspended" + (days ? " for " + days + " days." : ".");
  await loadUsers(); if(S.tab === "pros") loadData();
}
function statusCell(u){
  if(u.is_staff) return "";
  const st = u.account_status || "active";
  return `${st !== "active" ? `<div><span class="chip red">${st === "blocked" ? "Blocked" : "Suspended"}</span></div><div class="xs muted2 mt8" style="max-width:200px">${esc(u.status_reason || "")}${u.status_until ? " · until " + fmt(u.status_until) : ""}</div>` : ""}
    <div class="row mt8" style="gap:6px;flex-wrap:wrap">${st === "active"
      ? `<button class="btn sm" onclick="setUserStatus('${u.id}','suspended')">Suspend</button><button class="btn sm danger" onclick="setUserStatus('${u.id}','blocked')">Block</button>`
      : `<button class="btn sm" onclick="setUserStatus('${u.id}','active')">Restore</button>`}</div>`;
}

const ID_NAMES = { aadhaar: "Aadhaar card", pan: "PAN card", driving_licence: "Driving licence", passport: "Passport" };
async function loadKycAll(){
  const { data, error } = await sb.from("photographer_kyc").select("*");
  if(error){ S.kycErr = /photographer_kyc|does not exist|schema cache/i.test(error.message) ? "ID checks need the latest database update." : error.message; S.kycAll = {}; render(); return; }
  S.kycAll = {}; (data || []).forEach(k => S.kycAll[k.id] = k);
  // short-lived private links to the photos (admins only)
  const paths = []; (data || []).forEach(k => [k.front_path, k.back_path, k.selfie_path].forEach(p => p && paths.push(p)));
  S.kycUrls = S.kycUrls || {};
  const need = paths.filter(p => !S.kycUrls[p]);
  if(need.length){
    try{ const r = await sb.storage.from("kyc").createSignedUrls(need, 3600); (r.data || []).forEach(x => { if(x && x.path && x.signedUrl) S.kycUrls[x.path] = x.signedUrl; }); }catch(e){}
  }
  render();
}
function kycBox(p, canDecide){
  const k = (S.kycAll || {})[p.id];
  if(!S.kycAll) return `<div class="xs muted2 mt12">Loading ID check…</div>`;
  if(!k || k.status === "not_submitted") return `<div class="kycbox mt12 none"><b>ID check:</b> not submitted yet. They'll see a "Verify your identity" step in the app.</div>`;
  const img = (path, label) => path ? `<a class="kimg" href="${esc((S.kycUrls || {})[path] || "#")}" target="_blank" rel="noopener">${(S.kycUrls || {})[path] ? `<img src="${esc(S.kycUrls[path])}" alt="${label}">` : `<span>loading…</span>`}<i>${label}</i></a>` : "";
  const chip = { submitted: '<span class="chip amber">Waiting for check</span>', verified: '<span class="chip green">ID verified</span>', rejected: '<span class="chip red">Asked to re-do</span>' }[k.status] || "";
  return `<div class="kycbox mt12">
    <div class="between" style="flex-wrap:wrap;gap:8px"><div><b>ID check</b> · ${esc(ID_NAMES[k.id_type] || k.id_type)}${k.id_last4 ? " · ends " + esc(k.id_last4) : ""} · sent ${ago(k.submitted_at)}</div>${chip}</div>
    <div class="kimgs mt8">${img(k.selfie_path, "Face photo")}${img(k.front_path, k.id_type === "passport" ? "Photo page" : "ID front")}${img(k.back_path, k.id_type === "passport" ? "Address page" : "ID back")}</div>
    <div class="xs muted2 mt8">Check: the face matches the ID photo, the name matches "${esc(p.display_name || "")}", the ID isn't expired or edited, and the photo is clear.</div>
    ${k.note && k.status === "rejected" ? `<div class="xs mt8" style="color:#ff8f9b">Asked: ${esc(k.note)}</div>` : ""}
    ${canDecide && k.status !== "verified" ? `<div class="row mt12" style="flex-wrap:wrap">
      <button class="btn sm primary" onclick="reviewKyc('${p.id}','verified')">ID looks genuine</button>
      <button class="btn sm danger" onclick="reviewKyc('${p.id}','rejected')">Ask for new photos…</button></div>` : ""}

async function reviewKyc(id, status){
  let note = null;
  if(status === "rejected"){ note = prompt("What should they re-do? (they'll get this by email)", "The photo is blurry — please retake it in good light."); if(!note) return; }
  S.err = ""; S.note = "";
  const { error } = await sb.rpc("kyc_review", { p_pg: id, p_status: status, p_note: note });
  if(error){ S.err = error.message; render(); return; }
  S.note = status === "verified" ? "ID marked as verified." : "Asked them for new ID photos (emailed).";
  await loadKycAll();
}

function cellHtml(k, v){

/* sortable, searchable tables with CSV */
const TB = {};
function tbState(id){ return S.tb[id] || (S.tb[id] = { q: "", sort: null, dir: -1, limit: 50 }); }
let tbTimer = null;
function tbQ(id, v){ tbState(id).q = v; tbState(id).limit = 50; clearTimeout(tbTimer); tbTimer = setTimeout(render, 180); }
function tbSort(id, k){ const s = tbState(id); if(s.sort === k) s.dir = -s.dir; else { s.sort = k; s.dir = -1; } render(); }
function tbMore(id){ tbState(id).limit += 200; render(); }
function tbCsv(id){
  const t = TB[id]; if(!t) return;
  const q = v => { v = v == null ? "" : typeof v === "object" ? JSON.stringify(v) : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; };
  const keys = t.cols.map(c => c[0]);
  const blob = new Blob([t.cols.map(c => c[1].replace(/<[^>]+>/g, "")).join(",") + "\n" + t.rows.map(r => keys.map(k => q(r[k])).join(",")).join("\n")], { type: "text/csv" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "snappro-" + id + "-" + istToday() + ".csv";
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function cmpv(a, b){ if(a == null && b == null) return 0; if(a == null) return -1; if(b == null) return 1;
  const na = Number(a), nb = Number(b); if(!isNaN(na) && !isNaN(nb) && a !== "" && b !== "") return na - nb;
  return String(a).localeCompare(String(b)); }
function cell(c, r){
  const v = r[c[0]], t = c[2];
  if(typeof t === "function") return t(r);
  if(v == null || v === "") return `<span class="muted2">—</span>`;
  if(t === "n") return num(v);
  if(t === "inr") return inr(v);
  if(t === "pct") return v + "%";
  if(t === "dt") return dt(v);
  if(t === "d") return fmt(v);
  if(t === "ago") return ago(v);
  if(t === "chip") return `<span class="chip">${esc(v)}</span>`;
  return esc(v);
}
function dtable(id, title, cols, rows, o){

  if(st.q){ const q = st.q.toLowerCase(); list = list.filter(r => Object.values(r).some(v => v != null && typeof v !== "object" && String(v).toLowerCase().includes(q))); }
  if(st.sort){ const k = st.sort; list = [...list].sort((a, b) => cmpv(a[k], b[k]) * st.dir); }

  const shown = list.slice(0, st.limit);
  return `<div class="card ${o.cls || ""}" ${o.span ? 'style="grid-column:1/-1"' : ""}>

      <tbody>${shown.map(r => `<tr ${o.click && o.click(r) ? `class="rowlink" onclick="${o.click(r)}"` : ""} ${o.rowCls ? `data-x="${o.rowCls(r) || ""}"` : ""}>${cols.map(c => `<td>${cell(c, r)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`

  </div>`;
}

function leadMatch(x){
  const f = S.leadF || "all";
  if(f === "customer" || f === "photographer") return x.role === f;
  if(f === "hot") return x.role === "customer" && x.quoted > 0 && !x.booked;
  if(f === "cold") return x.role === "customer" && !x.requests && Date.now() - Date.parse(x.created_at) > 2 * 864e5;
  if(f === "waiting") return x.stage === "Waiting for approval";
  if(f === "booked") return x.booked > 0;
  if(f === "untracked") return /^Unknown/.test(x.channel);
  if(f.startsWith("ch:")) return x.channel === f.slice(3);
  if(f.startsWith("st:")) return x.stage === f.slice(3);
  return true;
}

/* campaign link builder: every ad / post / poster gets its own trackable link */
function linkBuilder(){
  const B = S.lb || (S.lb = { page: "/", source: "", medium: "", campaign: "", content: "", term: "" });
  const pages = [["/","Home page"],["/app.html#signup","App — customer sign-up"],["/app.html#join","App — photographer sign-up"],["/photographers/","Find photographers"],["/photography-prices/","Prices page"],["custom","Another page…"]];
  const path = B.page === "custom" ? (B.custom || "/") : B.page;
  const [p, hash] = path.split("#");
  const qs = ["source","medium","campaign","content","term"].filter(x => B[x]).map(x => "utm_" + x + "=" + encodeURIComponent(B[x].trim().toLowerCase().replace(/\s+/g, "_"))).join("&");
  const url = "https://snappro.in" + (p.startsWith("/") ? p : "/" + p) + (qs ? (p.includes("?") ? "&" : "?") + qs : "") + (hash ? "#" + hash : "");
  const inp = (k, ph) => `<input id="lb_${k}" class="input" style="padding:9px 12px" placeholder="${ph}" value="${esc(B[k] || "")}" oninput="S.lb.${k}=this.value;clearTimeout(tbTimer);tbTimer=setTimeout(render,250)">`;
  return `<div class="sec mt24">Campaign link builder</div>
  <div class="card"><div class="xs muted2">Make a separate link for every ad, Instagram post, WhatsApp message or QR poster. Visits, sign-ups and bookings from it show up under Campaigns above and on the Leads tab.</div>

      ${B.page === "custom" ? `<label class="xs muted">Path${inp("custom", "/wedding-photographers-in-delhi/")}</label>` : ""}
      <label class="xs muted">Source (where)${inp("source", "instagram, google, whatsapp, poster")}</label>
      <label class="xs muted">Medium (type)${inp("medium", "paid_social, cpc, story, qr, sms")}</label>
      <label class="xs muted">Campaign (name)${inp("campaign", "diwali_weddings")}</label>

      <label class="xs muted">Keyword${inp("term", "wedding photographer delhi")}</label>
    </div>
    <div class="row mt12" style="flex-wrap:wrap"><input class="input grow mono" readonly value="${esc(url)}" onclick="this.select()">

async function refAction(id, action){
  const L = { reward: "Give both rewards now?", hold: "Hold this referral's rewards for review?", clear: "Clear the hold? Rewards are given if they've qualified.", remove: "Remove the invite link between these two accounts?" };
  if(!confirm(L[action])) return;
  const { error } = await sb.rpc("admin_referral_action", { p_user: id, p_action: action });
  if(error){ S.err = error.message; render(); return; }
  S.note = "Done."; deptLoad("referrals", true); if(S.dept.trust) deptLoad("trust", true);
}

const REP_REASON = { abuse: "Abusive / threatening", inappropriate: "Sexual / inappropriate", fraud: "Pay outside / scam", fake: "Fake profile", spam: "Spam", safety: "Feels unsafe", other: "Other" };
/* act on a report: Resolved and Dismiss ask what was done (saved with the report) */
async function reportAction(id, status){
  let note = null;
  if(status === "resolved" || status === "dismissed"){
    note = prompt(status === "resolved" ? "What did you do? (for example: warned them, suspended 7 days, removed the review)" : "Why dismiss it? (for example: no rule broken)", "");
    if(note === null) return;
  }
  const { error } = await sb.rpc("admin_report_action", { p_id: id, p_status: status, p_note: note });
  if(error){ S.err = error.message; render(); return; }
  S.note = "Report #" + id + ": " + status + "."; deptLoad("trust", true);
}

const EV_GROUPS = [["","Everything"],["accounts","Accounts"],["photographers","Photographers"],["requests","Requests & quotes"],["bookings","Bookings"],["money","Money"],["reviews","Reviews"],["chat","Chat"],["rewards","Rewards"],["referrals","Invites"],["admin","Staff actions"]];
const EV_COLOR = { accounts: "#4d8dff", photographers: "#a67cff", requests: "#5fd3e0", bookings: "#ff5a1f", money: "#28c76f", reviews: "#ffc857", chat: "#8b8b9e", rewards: "#ff8fb1", referrals: "#f6a35b", admin: "#ff4d5e", other: "#61617a" };
const TL_RANGES = [["1h","Last hour"],["today","Today"],["24h","24 hours"],["7d","7 days"],["30d","30 days"],["custom","Custom"]];
function tlRange(){
  const now = Date.now(), r = S.tlR || "24h";
  if(r === "1h") return [new Date(now - 3600e3), new Date(now)];
  if(r === "today") return [new Date(istToday() + "T00:00:00+05:30"), new Date(now)];
  if(r === "7d") return [new Date(now - 7 * 864e5), new Date(now)];
  if(r === "30d") return [new Date(now - 30 * 864e5), new Date(now)];
  if(r === "custom" && S.tlFrom) return [new Date(S.tlFrom), S.tlTo ? new Date(S.tlTo) : new Date(now)];
  return [new Date(now - 864e5), new Date(now)];
}
let tlSeq = 0, tlTimer = null;
async function loadTimeline(quiet){
  const [f, t] = tlRange(), seq = ++tlSeq;
  if(!quiet){ S.tl = Object.assign(S.tl || {}, { busy: true }); render(); }
  const { data, error } = await sb.rpc("admin_timeline", { p_from: f.toISOString(), p_to: t.toISOString(), p_group: S.tlG || null, p_user: null, p_limit: 5000 });
  if(seq !== tlSeq) return;
  const prev = S.tl && S.tl.rows;
  S.tl = { rows: error ? [] : (data || []), err: error ? (/function/i.test(error.message) ? "This needs the latest database update — run supabase/snappro.sql in the Supabase SQL Editor." : error.message) : "", busy: false, at: new Date() };
  if(!quiet || JSON.stringify(prev) !== JSON.stringify(S.tl.rows)) render();
}
function tlLive(on){ S.tlLive = on; clearInterval(tlTimer); if(on) tlTimer = setInterval(() => { if(!document.hidden && S.tab === "timeline") loadTimeline(true); }, 15000); render(); }

  if(T[k]) return T[k]();

function evGroup(k){ return k.startsWith("admin:") ? "admin" : /^(signup|profile_setup|role_change|source_recorded|account_|user_reported|user_blocked|user_unblocked)/.test(k) ? "accounts" : /^referral_/.test(k) ? "referrals" : /^(pg_|kyc_)/.test(k) ? "photographers"
  : /^(request_|quote_sent)/.test(k) ? "requests" : /^(booking_|balance_)/.test(k) ? "bookings" : /^(payment_|refund_|payout_|storage_)/.test(k) ? "money" : k === "review_posted" ? "reviews" : k === "chat_message" ? "chat" : /^reward_/.test(k) ? "rewards" : "other"; }
function vTimeline(){
  if(!S.tl){ S.tl = { busy: true, rows: null }; setTimeout(() => loadTimeline(true)); }

  const rows = (S.tl.rows || []).map(e => ({ ...e, _t: evText(e) })).filter(e => !q || e._t.replace(/<[^>]+>/g, "").toLowerCase().includes(q));
  const counts = {}; (S.tl.rows || []).forEach(e => { const g = e.grp || evGroup(e.kind); counts[g] = (counts[g] || 0) + 1; });
  TB.timeline = { cols: [["at","When"],["kind","What"],["text","Details"],["user_pid","SnapPro ID"],["user_name","Person"],["other_name","With"],["amount","Amount"],["city","City"],["category","Shoot"]],
                  rows: rows.map(e => ({ ...e, text: e._t.replace(/<[^>]+>/g, "") })) };

  return `<div class="between" style="flex-wrap:wrap;gap:12px">

    <div class="tabs mt12" style="width:fit-content;flex-wrap:wrap">${EV_GROUPS.map(([k, l]) => `<button class="tab ${(S.tlG || "") === k ? "on" : ""}" onclick="S.tlG='${k}';loadTimeline()"><span class="dot" style="background:${EV_COLOR[k] || "#fff"}"></span>${l}${!S.tlG && k && counts[k] ? ` <span class="muted2">${counts[k]}</span>` : ""}</button>`).join("")}</div>

    <div class="card mt12 tl">${rows.slice(0, lim).map(e => { const g = e.grp || evGroup(e.kind);

      ${rows.length > lim ? `<button class="btn sm mt12" onclick="S.tlLim=${lim + 500};render()">Show more (${num(rows.length - lim)} left)</button>` : ""}</div>`;

/* ===================== ONE PERSON — EVERYTHING ===================== */
async function openUser(key){
  if(!key) return;
  S.u360 = { key, data: null, err: "" }; render();
  const { data, error } = await sb.rpc("admin_user_360", { p_key: String(key) });
  if(!S.u360 || S.u360.key !== key) return;
  if(error) S.u360.err = /function/i.test(error.message) ? "This needs the latest database update — run supabase/snappro.sql in the Supabase SQL Editor." : error.message;
  else S.u360.data = data;
  render();
}
function closeUser(){ S.u360 = null; render(); }
async function findAnyone(){
  const q = (el("findQ") || {}).value || ""; const t = q.trim(); if(!t) return;
  if(/@|^SP[CP]\d+$/i.test(t) || /^\+?\d[\d\s-]{6,}$/.test(t) || /^[0-9a-f-]{36}$/i.test(t)) return openUser(/^[0-9a-f-]{36}$/i.test(t) || t.includes("@") ? t : t.replace(/[\s-]/g, "").toUpperCase());
  if(!S.users) await loadUsers(true);
  const hits = (S.users || []).filter(u => [u.name, u.email, u.phone, u.public_id, u.city].some(v => v && String(v).toLowerCase().includes(t.toLowerCase())));
  if(hits.length === 1) return openUser(hits[0].id);
  S.u360 = { key: t, hits, data: null, err: hits.length ? "" : "No one found for “" + t + "”." }; render();
}
function kvs(pairs){ return pairs.filter(p => p[1] != null && p[1] !== "").map(([k, v]) => `<div class="kv"><span>${k}</span><span>${v}</span></div>`).join(""); }
function touchHtml(t){
  if(!t) return `<span class="muted2">Not recorded</span>`;
  return kvs([["Source", esc(t.source)], ["Medium", esc(t.medium)], ["Campaign", esc(t.campaign)], ["Ad content", esc(t.content)], ["Keyword", esc(t.term)],
    ["Sent by site", esc(t.referrer)], ["First page", t.landing ? `<span class="mono">${esc(t.landing)}</span>` : ""], ["Came for", esc(CAT_NAMES[t.shoot] || t.shoot)],
    ["Invite code", esc(t.ref)], ["Clicked an ad", t.ads_click ? "Yes" : ""], ["When", t.at ? dt(t.at) : ""]]) || `<span class="muted2">Came directly (typed the address or a bookmark)</span>`;
}
function vUser360(){
  const U = S.u360; if(!U) return "";
  const D = U.data, m = D && D.money;
  const shell = inner => `<div class="sheet-bg" onclick="if(event.target===this)closeUser()"><div class="sheet wide" role="dialog" aria-label="Person">${inner}</div></div>`;
  if(U.hits && !D) return shell(`<div class="between"><div class="h2">People matching “${esc(U.key)}”</div><button class="btn sm" onclick="closeUser()">Close</button></div>
    ${U.err ? `<div class="warn mt12">${esc(U.err)}</div>` : `<div class="tblwrap mt12"><table><tbody>${U.hits.slice(0, 100).map(u => `<tr class="rowlink" onclick="openUser('${u.id}')"><td><b>${esc(u.name || "—")}</b> <span class="xs" style="color:var(--accent)">${esc(u.public_id || "")}</span></td><td>${esc(u.role)}</td><td>${esc(u.city || "")}</td><td class="muted">${m !== false ? esc(u.email || "") : ""}</td></tr>`).join("")}</tbody></table></div>`}`);
  if(U.err) return shell(`<div class="between"><div class="h2">Person</div><button class="btn sm" onclick="closeUser()">Close</button></div><div class="warn mt12">${esc(U.err)}</div>`);
  if(!D) return shell(`<div class="between"><div class="h2">Loading…</div><button class="btn sm" onclick="closeUser()">Close</button></div><div class="empty">Loading…</div>`);
  const p = D.profile, g = D.photographer, a = p.acq || {}, bks = D.bookings || [];
  const spent = bks.filter(b => b.customer_name && !["cancelled","pending_payment"].includes(b.status)).reduce((t, b) => t + Number(b.total_amount || 0), 0);
  const sec = (title, inner, open) => `<details class="u3" ${open ? "open" : ""}><summary>${title}</summary><div class="mt8">${inner}</div></details>`;
  const mini = (cols, rows, click) => rows && rows.length ? `<div class="tblwrap"><table class="dt"><thead><tr>${cols.map(c => `<th>${c[1]}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr ${click ? `class="rowlink" onclick="${click(r)}"` : ""}>${cols.map(c => `<td>${cell(c, r)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>` : `<div class="xs muted2">None.</div>`;
  return shell(`
    <div class="between" style="align-items:flex-start;flex-wrap:wrap">
      <div><div class="h1">${esc(p.name || "—")}</div>
        <div class="row mt8" style="flex-wrap:wrap;gap:6px"><span class="chip super">${esc(p.public_id || "")}</span><span class="chip ${p.role === "photographer" ? "manager" : "admin"}">${esc(p.role)}</span>
          <span class="chip ${p.status === "active" ? "green" : "red"}">${esc(p.status || "active")}</span><span class="chip"><span class="dot" style="background:${chColor(p.channel, 0)}"></span>${esc(p.channel)}</span>
          ${p.referral_flag ? `<span class="chip red">Invite held: ${esc(p.referral_flag)}</span>` : ""}</div></div>
      <div class="row"><button class="btn sm" onclick="S.tlG='';S.tlQ='${esc(p.public_id || "")}';S.tlR='30d';S.u360=null;S.tl=null;openTab('timeline')">On timeline</button><button class="btn sm" onclick="closeUser()">Close</button></div>
    </div>
    <div class="grid mt16">
      ${kpi(fmt(p.created_at), "Joined", ago(p.created_at))}
      ${kpi(p.last_seen_at ? ago(p.last_seen_at) : "—", "Last opened SnapPro", p.last_seen_at ? dt(p.last_seen_at) : "")}
      ${kpi(num((D.requests || []).length), "Shoots posted")}
      ${kpi(num(bks.length), "Bookings", num(bks.filter(b => b.status === "completed").length) + " completed")}
      ${m && p.role !== "photographer" ? kpi(inr(spent), "Spent") : ""}
      ${m && p.role === "photographer" ? kpi(inr(bks.filter(b => b.status === "completed").reduce((t, b) => t + Number(b.photographer_amount || 0), 0)), "Earned") : ""}
      ${kpi(num((D.referred || []).length), "Friends invited")}
      ${kpi(num(D.blocked_by), "Blocked by", num(D.blocks_made) + " blocked by them", D.blocked_by ? "hl" : "")}
      ${m ? kpi(num((D.reports || []).filter(r => r.direction === "about them").length), "Reports about them", "", (D.reports || []).some(r => r.direction === "about them" && (r.status === "open" || r.status === "reviewing")) ? "hl" : "") : ""}
    </div>
    <div class="grid2 mt16">
      <div class="card"><div class="sec">Details</div>${kvs([["Email", m && p.email ? `<a href="mailto:${esc(p.email)}">${esc(p.email)}</a>` : ""], ["Phone", m && p.phone ? `<a href="tel:${esc(p.phone)}">${esc(p.phone)}</a>` : ""],
        ["City", esc([p.city, p.state, p.pincode].filter(Boolean).join(", "))], ["Member no.", num(p.member_no)], ["Account", esc(p.status) + (p.status_reason ? " — " + esc(p.status_reason) : "") + (p.status_until ? " until " + dt(p.status_until) : "")],
        ["Invited by", p.referred_by ? userLink(p.referred_by.id, p.referred_by.name, p.referred_by.public_id) + (p.referral_at ? " · " + fmt(p.referral_at) : "") : ""], ["Invite rewarded", p.referral_rewarded_at ? dt(p.referral_rewarded_at) : ""]])}
        ${m ? `<div class="row mt12" style="flex-wrap:wrap">${p.status === "active" ? `<button class="btn sm danger" onclick="setUserStatus('${p.id}','suspended').then(()=>openUser('${p.id}'))">Suspend</button><button class="btn sm danger" onclick="setUserStatus('${p.id}','blocked').then(()=>openUser('${p.id}'))">Block</button>` : `<button class="btn sm" onclick="setUserStatus('${p.id}','active').then(()=>openUser('${p.id}'))">Restore account</button>`}
          ${p.name !== "Deleted user" ? `<button class="btn sm danger" onclick="adminDeleteAccount('${p.id}')">Delete account…</button>` : ""}
          ${p.phone ? `<a class="btn sm" href="https://wa.me/${esc(String(p.phone).replace(/\D/g, "").replace(/^(\d{10})$/, "91$1"))}" target="_blank" rel="noopener">WhatsApp</a>` : ""}</div>` : ""}</div>
      <div class="card"><div class="sec">How they found SnapPro</div>
        <div class="xs muted2">First visit</div>${touchHtml(a.first)}
        ${a.last && JSON.stringify(a.last) !== JSON.stringify(a.first) ? `<div class="xs muted2 mt12">Last visit before signing up</div>${touchHtml(a.last)}` : ""}
        ${a.device ? `<div class="kv mt8"><span>Device</span><span>${esc(a.device)}</span></div>` : ""}</div>
      ${g ? `<div class="card" style="grid-column:1/-1"><div class="sec">Photographer</div><div class="grid">
        ${kpi(esc(g.approval_status), "Approval", g.approved_at ? fmt(g.approved_at) : "")}${kpi(esc(g.kyc || "not sent"), "ID check")}${kpi(g.rating ? Number(g.rating).toFixed(1) + "★" : "—", "Rating", num(g.review_count) + " reviews")}
        ${kpi(num(g.jobs_done), "Shoots done")}${kpi(num(g.photos), "Portfolio items")}${kpi(g.is_online ? "Available" : "Off", "Right now")}${kpi(esc((g.categories || []).map(c => CAT_NAMES[c] || c).join(", ") || "—"), "Shoots offered")}
        ${m ? kpi(g.commission_pct != null ? g.commission_pct + "%" : "Default", "Commission") : ""}${m && g.storage_quota ? kpi((Number(g.storage_quota) / 1048576).toFixed(0) + " MB", "Storage") : ""}${g.featured_until ? kpi(fmt(g.featured_until), "Featured until") : ""}${kpi(esc({ city: "Own city only", nearby: "Nearby cities", anywhere: "Anywhere in India" }[g.travel] || "Own city only"), "Travels for shoots")}</div></div>` : ""}
    </div>
    <div class="mt16">
      ${sec("Timeline — everything they did (" + num((D.timeline || []).length) + ")", `<div class="tl">${(D.timeline || []).map(e => { const gg = evGroup(e.kind);
        return `<div class="tlrow"><div class="tlt">${dts(e.at)}</div><span class="tldot" style="background:${EV_COLOR[gg]}"></span><div class="grow">${evText({ ...e, user_id: null, other_id: null }, true)}${e.entity === "booking" && e.entity_id ? ` · ${bkLink(e.entity_id, "booking")}` : ""}</div></div>`; }).join("") || `<div class="xs muted2">Nothing yet.</div>`}</div>`, true)}
      ${sec("Bookings (" + num(bks.length) + ")", mini([["created_at","Booked","dt"],["start_at","Shoot","dt"],["status","Status","chip"],["category","Shoot", r => esc(CAT_NAMES[r.category] || r.category)],["customer_name","Customer"],["photographer_name","Photographer"]].concat(m ? [["total_amount","Value","inr"],["discount_amount","Discount","inr"]] : []).concat([["payment_status","Payment"],["balance_status","Balance"],["payout_status","Payout"],["messages","Messages","n"],["stars","Review", r => r.stars ? "★".repeat(r.stars) : "—"]]), bks, r => `openBooking('${r.id}')`))}
      ${(D.requests || []).length ? sec("Shoots posted (" + num(D.requests.length) + ")", mini([["created_at","Posted","dt"],["category","Shoot", r => esc(CAT_NAMES[r.category] || r.category)],["city","City"],["urgency","When"],["start_at","Starts","dt"],["budget","Budget","inr"],["quotes","Quotes","n"],["status","Status","chip"]], D.requests)) : ""}
      ${(D.quotes || []).length ? sec("Quotes sent (" + num(D.quotes.length) + ")", mini([["created_at","Sent","dt"],["category","Shoot", r => esc(CAT_NAMES[r.category] || r.category)],["city","City"],["price","Price","inr"],["won","Won", r => r.won ? '<span class="chip green">Won</span>' : ""],["request_status","Request","chip"]], D.quotes)) : ""}
      ${m && (D.payments || []).length ? sec("Payments (" + num(D.payments.length) + ")", mini([["created_at","Started","dt"],["paid_at","Paid","dt"],["stage","Stage"],["amount","Amount","inr"],["status","Status","chip"],["payment_group","Method", r => esc(methodName(r.payment_group) || "")],["refund_status","Refund"],["refunded_amount","Refunded","inr"],["environment","Mode"],["order_id","Order"]], D.payments, r => r.booking_id ? `openBooking('${r.booking_id}')` : "")) : ""}
      ${m && (D.storage_orders || []).length ? sec("Storage plans", mini([["created_at","Ordered","dt"],["plan","Plan"],["amount","Amount","inr"],["status","Status","chip"],["period_end","Until","d"]], D.storage_orders)) : ""}
      ${sec("Visits & pages viewed (" + num((D.visits || []).length) + " days)", mini([["day","Day","d"],["first_at","First","dt"],["last_at","Last","dt"],["views","Views","n"],["device","Device"],["channel","Channel"],["referrer","From site"],["utm_campaign","Campaign"],["ref_code","Invite code"],["paths","Pages, in order", r => (r.paths || []).map(x => `<span class="mono">${esc(x)}</span>`).join(" → ")]], D.visits))}
      ${sec("Rewards (" + num((D.rewards || []).length) + ")", mini([["created_at","Given","dt"],["title","Reward"],["source","From"],["status","Status","chip"],["uses_left","Uses left","n"],["expires_at","Expires","d"],["used_at","Used","dt"]], D.rewards))}
      ${sec("Friends they invited (" + num((D.referred || []).length) + ")", mini([["referral_at","Joined","dt"],["name","Friend", r => userLink(r.id, r.name, r.public_id)],["role","Type"],["referral_rewarded_at","Rewarded","dt"],["referral_flag","Held"]], D.referred))}
      ${(D.reviews_given || []).length || (D.reviews_received || []).length ? sec("Reviews", mini([["created_at","When","dt"],["stars","Stars", r => "★".repeat(r.stars)],["customer_name","From"],["body","Review"]], (D.reviews_received || []).concat(D.reviews_given || []), r => `openBooking('${r.booking_id}')`)) : ""}
      ${m && (D.reports || []).length ? sec("Reports (" + num(D.reports.length) + ")", mini([["created_at","When","dt"],["direction","Report"],["other_name","Other person", r => userLink(r.other_id, r.other_name, r.other_pid)],["reason","Why", r => esc(REP_REASON[r.reason] || r.reason)],["context","On"],["snapshot","What was said", r => r.snapshot ? `<span class="xs" style="white-space:pre-wrap">${esc(String(r.snapshot).slice(0, 400))}</span>` : ""],["details","Their words"],["status","Status","chip"],["action_note","Outcome"]], D.reports), D.reports.some(r => r.status === "open")) : ""}
      ${m && (D.admin_actions || []).length ? sec("Staff actions on this account (" + num(D.admin_actions.length) + ")", mini([["at","When","dt"],["staff_email","Staff"],["action","Action"],["details","Details", r => r.details ? `<span class="xs mono">${esc(JSON.stringify(r.details)).slice(0, 200)}</span>` : ""]], D.admin_actions)) : ""}
    </div>`);
}

/* delete someone's account when they ask by email (Google Play requires a way to do this) */
async function adminDeleteAccount(id){
  const reason = prompt("Delete this account? Their name, email, phone, profile, portfolio, UPI and ID photos are erased. Booking and payment records stay without personal details. This can't be undone.\n\nWrite why (for example: asked by email on 12 Oct):", "");
  if(reason === null) return;
  if(!reason.trim()){ S.err = "Write why the account is being deleted."; render(); return; }
  const { data, error } = await sb.rpc("admin_delete_account", { p_user: id, p_reason: reason.trim() });
  if(error){ S.err = error.message; render(); return; }
  const f = (data && data.files) || {};
  if((f.kyc || []).length){ try{ await sb.storage.from("kyc").remove(f.kyc); }catch(e){} }
  S.note = "Account deleted." + (data && data.login_closed ? "" : " Also remove their login in Supabase → Authentication → Users.");
  if(S.dept.trust) deptLoad("trust", true);
  openUser(id);
}

/* ============================ render ========================== */

function render(){
  const app = el("app");
  const focus = document.activeElement;
  const fid = focus && focus.id ? focus.id : null;
  const caret = fid && focus.setSelectionRange ? focus.selectionStart : null;

  app.innerHTML =
    S.view==="login"   ? vLogin()   :
    S.view==="setup"   ? vSetup()   :
    S.view==="reset"   ? vReset()   :
    S.view==="newpw"   ? vNewPw()   :
    S.view==="code"    ? vCode()    :
    S.view==="denied"  ? vDenied()  :
    S.view==="console" ? vConsole() + vDrill() + vUser360() + vBooking() + vChatView() : vLogin();

  try{ drawCharts(); }catch(e){ console.warn('charts', e); }
  try{ drawReportCharts(); }catch(e){ console.warn('report charts', e); }
  try{ drawDeptCharts(); }catch(e){ console.warn('dept charts', e); }
  if(fid){
    const n = el(fid);
    if(n){ n.focus(); if(caret!=null && n.setSelectionRange){ try{ n.setSelectionRange(caret,caret); }catch(e){} } }
  }
}

window.addEventListener("error", e => console.error("Admin:", e.message));
document.addEventListener("keydown", e => { if(e.key === "Escape" && (S.bk || S.drill || S.u360)){ if(S.bk) S.bk = null; else if(S.drill) S.drill = null; else S.u360 = null; render(); } });
boot();
</script>
