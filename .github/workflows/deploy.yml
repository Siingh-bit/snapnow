name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy to Hostinger via FTP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare connection details
        id: prep
        run: |
          RAW_SERVER="${{ secrets.FTP_SERVER }}"
          CLEAN_SERVER=$(echo "$RAW_SERVER" | sed -e 's|^[a-zA-Z0-9]*://||' -e 's|/.*$||' -e 's|:[0-9]*$||' | tr -d '[:space:]')
          if [ -z "$CLEAN_SERVER" ]; then
            CLEAN_SERVER="ftp.snappro.in"
          fi
          echo "server=$CLEAN_SERVER" >> $GITHUB_OUTPUT

      - name: Clean accidental subfolder
        run: |
          curl -s --ftp-pasv -Q "-DELE public_html/index.html" -Q "-RMD public_html" -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ steps.prep.outputs.server }}/" -o /dev/null || true

      - name: Sync files to Hostinger
        id: sync1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.prep.outputs.server }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          timeout: 180000
          exclude: |
            **/.git*
            **/.git*/**
            **/.github*
            **/.github*/**
            supabase/**
            README.md
            **/*.md
            LICENSE
            .gitignore
            Dockerfile
            nginx.conf
            .dockerignore

      - name: Wait before retry
        if: steps.sync1.outcome == 'failure'
        run: sleep 30

      - name: Sync files to Hostinger (retry)
        if: steps.sync1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.prep.outputs.server }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          timeout: 180000
          exclude: |
            **/.git*
            **/.git*/**
            **/.github*
            **/.github*/**
            supabase/**
            README.md
            **/*.md
            LICENSE
            .gitignore
            Dockerfile
            nginx.conf
            .dockerignore

      - name: Tell Bing, Yandex and other IndexNow engines about the pages
        continue-on-error: true
        run: |
          sleep 20
          URLS=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed -e 's/<loc>//' -e 's/<\/loc>//' | head -10000 | python3 -c "import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))")
          curl -s -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"snappro.in\",\"key\":\"82cecc9137fe281e140598bacd5da529\",\"keyLocation\":\"https://snappro.in/82cecc9137fe281e140598bacd5da529.txt\",\"urlList\":$URLS}"
