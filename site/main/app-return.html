<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1d1a16">
<title>Back to the SnapPro app</title>
<!--
  Google sign-in for the SnapPro Android app lands here, then hands the one-time code back to the app.
  Phones' browsers sometimes refuse to jump straight from Google to an app, so this page tries once and
  also shows a button (a tap always works). It only ever hands back to the SnapPro app itself
  (snappro://auth) or, while testing, the Expo Go app on the same Wi-Fi. Not part of the public site.
-->
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;background:#1d1a16;color:#fffdf8;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  img{width:72px;height:72px;border-radius:18px}
  h1{font-size:22px;margin:20px 0 8px}
  p{color:#cfc7ba;font-size:15px;line-height:1.5;margin:0 0 24px;max-width:300px}
  a.btn{display:inline-block;background:#c8471d;color:#fff;border-radius:12px;padding:14px 28px;font-size:16px;font-weight:600;text-decoration:none}
  a.btn[hidden]{display:none}
</style>
</head>
<body>
  <div>
    <img src="/icon-192.png" alt="SnapPro">
    <h1 id="t">Taking you back to SnapPro…</h1>
    <p id="m">If the app doesn't open by itself, tap the button.</p>
    <a class="btn" id="go" href="#">Open the SnapPro app</a>
  </div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var to = q.get("to") || "snappro://auth";
  var lan = "(192\\.168\\.\\d{1,3}\\.\\d{1,3}|10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|172\\.(1[6-9]|2\\d|3[01])\\.\\d{1,3}\\.\\d{1,3})";
  var ok = to === "snappro://auth" || new RegExp("^exp://" + lan + ":\\d{2,5}/--/auth$").test(to);
  var pass = new URLSearchParams();
  ["code", "error", "error_code", "error_description"].forEach(function (k) { if (q.get(k)) pass.set(k, q.get(k)); });
  var go = document.getElementById("go");
  // keep the one-time code out of this page's address and history
  try { history.replaceState(null, "", location.pathname); } catch (e) {}
  if (!ok || !pass.toString()) {
    document.getElementById("t").textContent = "Please try again";
    document.getElementById("m").textContent = "This sign-in link isn't complete. Go back to the SnapPro app and tap Continue with Google again.";
    go.hidden = true;
    return;
  }
  if (q.get("error")) document.getElementById("t").textContent = "Sign-in didn't finish";
  var target = to + "?" + pass.toString();
  go.href = target;
  location.replace(target);
})();
</script>
</body>
</html>
