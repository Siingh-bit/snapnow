<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1d1a16">
<title>You're offline — SnapPro</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;background:#1d1a16;color:#fffdf8;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  img{width:72px;height:72px;border-radius:18px}
  h1{font-size:22px;margin:20px 0 8px}
  p{color:#cfc7ba;font-size:15px;line-height:1.5;margin:0 0 24px;max-width:300px}
  button{background:#c8471d;color:#fff;border:0;border-radius:12px;padding:14px 28px;font-size:16px;font-weight:600}
</style>
</head>
<body>
  <div>
    <img src="/icon-192.png" alt="SnapPro">
    <h1>You're offline</h1>
    <p>SnapPro needs the internet to show photographers, quotes and bookings. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
  <script>window.addEventListener("online", function(){ location.reload(); });</script>
</body>
</html>
