      <input id="qPrice" class="input big" type="number" inputmode="numeric" min="100" max="1000000" step="50" value="${S.quote.price}" oninput="S.quote.price=Math.round(+this.value||0);setHtml('qHint',quoteHint(${r.budget}))">
      <div class="chips mt8">${[["Their budget", r.budget], ["Your usual", suggest]].map(([l,v]) => `<button class="chip" onclick="S.quote.price=${v};el('qPrice').value=${v};setHtml('qHint',quoteHint(${r.budget}))">${l}: ${inr(v)}</button>`).join("")}</div>
      <div id="qHint" class="mt6">${quoteHint(r.budget)}</div>
    </div>
    ${soon ? `<div class="field"><label>How soon can you get there?</label>
      <div class="chips">${[15,30,45,60,90].map(m => `<button class="chip lg ${S.quote.eta===m?'accent':''}" onclick="S.quote.eta=${m};render()">${m} min</button>`).join("")}</div></div>` : ""}
    <div class="field"><label for="qNote">Message to the customer <span class="muted2">(optional)</span></label>
      <textarea id="qNote" class="input" rows="3" maxlength="500" placeholder="e.g. I shoot on a full-frame camera and deliver 50+ edited photos within 48 hours." oninput="S.quote.note=this.value">${esc(S.quote.note)}</textarea></div>
    <div class="note">${icon("wallet",18,"var(--green)")}<div>The customer pays you directly after the shoot. SnapPro doesn't take a commission.</div></div>
    <button class="btn primary block mt16" ${S.loading.quote?"disabled":""} onclick="sendQuote('${r.id}')">${S.loading.quote ? "Sending…" : icon("send",16,"#fff") + " Send quote"}</button>
    <div id="formErr">${errHtml(S.formErr)}</div>
  </div>`;
}
function quoteHint(budget){
  const p = S.quote ? S.quote.price : 0;
  if(!p || p < 100) return `<div class="field-err">Enter a price of at least ₹100.</div>`;
  if(p > 1000000) return `<div class="field-err">That's above the ₹10,00,000 limit.</div>`;
  if(budget && p > budget) return `<div class="xs muted">${inr(p - budget)} above their budget — add a note explaining what's included.</div>`;
  return `<div class="xs green">Within their budget.</div>`;
}
async function sendQuote(id){
  const qv = S.quote, pv = el("qPrice") ? Math.round(+el("qPrice").value || 0) : qv.price;
  qv.price = pv;
  if(!pv || pv < 100 || pv > 1000000){ S.formErr = "Enter a price between ₹100 and ₹10,00,000."; render(); return; }
  S.loading.quote = true; S.formErr = null; render();
  try{
    await api.sendOffer(id, pv, qv.eta, (qv.note||"").trim());
    S.d.myOffers = await api.myOffers();
    S.loading.quote = false; S.quote = null;
    toast("Quote sent", "We'll let you know if you're booked", "send"); pop();
  }catch(e){ S.loading.quote = false; S.formErr = e.message; render(); }
}
async function withdrawOffer(id){
  if(!confirm("Withdraw this quote?")) return;
  try{ await api.withdrawOffer(id); S.d.myOffers = S.d.myOffers.filter(o => o.id !== id); toast("Quote withdrawn", "", "x"); render(); }
  catch(e){ toast("Couldn't withdraw", e.message, "x"); }
}

async function jobStep(id, to){
  if(to === "cancelled" && !confirm("Cancel this booking? The customer will be told and can book someone else.")) return;
  if(to === "completed" && !confirm("Mark this shoot as complete?")) return;
  S.loading.step = true; render();
  try{
    const b = await api.setBooking(id, { status: to });
    Object.assign(S.d.bookings.find(x => x.id === id), b);
    S.loading.step = false;
    toast(BK_LABEL[to], to === "completed" ? "Nice work! " + inr(b.price) + " added to your earnings" : "The customer can see this now", to === "cancelled" ? "x" : "check");
    if(to === "completed") api.loadMe().then(softRender).catch(() => {});
    render();
  }catch(e){ S.loading.step = false; toast("Couldn't update", e.message, "x"); render(); }
}

const AUTH_VIEWS = { welcome: vWelcome, signup: vSignup, otp: vOtp, login: vLogin, reset: vReset, newpw: vNewPw,
                     setupRole: vSetupRole, setupCust: vSetupCust, setupPg: vSetupPg };
const STACK_VIEWS = { pg: vPgProfile, photo: vPhoto, newRequest: vNewRequest, request: vRequest, confirm: vConfirm,
                      booking: vBooking, rate: vRate, chat: vChat, editName: vEditName, editLoc: vEditLoc,
                      quote: vQuote, job: vJob, portfolio: vPortfolio, editPg: vEditPg };
const CUST_TABS = [ ["home","Home","home",vCustHome], ["explore","Explore","search",vExplore], ["activity","Shoots","calendar",vActivity], ["profile","Profile","user",vProfile] ];
const PG_TABS   = [ ["home","Home","home",vPgHome], ["requests","Requests","bolt",vPgRequests], ["jobs","Shoots","calendar",vJobs], ["profile","Profile","user",vProfile] ];
const tabsFor = () => isPg() ? PG_TABS : CUST_TABS;

function scrollTop(){ try{ window.scrollTo(0, 0); }catch(e){} }
let ignorePop = 0;
function push(v, p){
  S.formErr = null; S.editPg = null;
  S.stack.push({ v, p: p || {} });
  try{ history.pushState({ snap: S.stack.length }, ""); }catch(e){}
  render(); scrollTop();
}
function pop(){
  if(!S.stack.length) return;
  S.stack.pop(); S.formErr = null;
  if(history.state && history.state.snap){ ignorePop++; try{ history.back(); }catch(e){ ignorePop--; } }
  render();
}
function replaceStack(v, p){
  S.formErr = null;
  if(S.stack.length) S.stack[S.stack.length - 1] = { v, p: p || {} }; else { S.stack.push({ v, p: p || {} }); try{ history.pushState({ snap: 1 }, ""); }catch(e){} }
  render(); scrollTop();
}
function go(tab){ S.tab = tab; S.stack = []; S.formErr = null; render(); scrollTop(); }
window.addEventListener("popstate", () => {
  if(ignorePop){ ignorePop--; return; }
  if(S.stack.length){ S.stack.pop(); S.formErr = null; render(); }
});

function tabBadge(id){
  if(isCustomer() && id === "activity") return S.d.requests.filter(r => r.status === "broadcasting" && (S.d.offers[r.id]||[]).length).length;
  if(isPg() && id === "requests") return newForMe().length;
  return 0;
}
function tabbarHtml(){
  return `<nav class="tabbar">${tabsFor().map(([id, label, ic]) => {
    const n = tabBadge(id);
    return `<button class="tab ${S.tab===id?'on':''}" onclick="go('${id}')" aria-label="${label}">${icon(ic,21)}<span>${label}</span>${n ? `<span class="badge">${n}</span>` : ""}</button>`;
  }).join("")}</nav>`;
}

function render(){
  const screen = el("screen"), tabs = el("tabs");
  if(!screen) return;
  pendingRender = false;
  let html = "", showTabs = false, mode = "";
  if(!S.booted){
    html = `<div class="splash"><div class="center"><div class="logo-lg">${icon("cam",32,"#fff",2)}</div><div class="h2 mt16">SnapPro</div></div></div>`;
  } else if(!S.me || /^setup/.test(S.auth.step || "")){
    html = (AUTH_VIEWS[S.auth.step] || vWelcome)();
  } else if(S.stack.length){
    const top = S.stack[S.stack.length - 1];
    html = (STACK_VIEWS[top.v] || (() => ""))(top.p || {});
    if(top.v === "chat") mode = "chat-mode";
  } else {
    const t = tabsFor().find(x => x[0] === S.tab) || tabsFor()[0];
    S.tab = t[0]; html = t[3](); showTabs = true;
  }
  screen.innerHTML = html;
  screen.className = (showTabs ? "" : "no-tabs ") + mode;
  if(tabs) tabs.innerHTML = showTabs ? tabbarHtml() : "";
  syncChatTimer();
}

/* chat refreshes every 3 seconds while it's open */
function syncChatTimer(){
  const top = S.stack[S.stack.length - 1];
  const id = top && top.v === "chat" ? top.p.id : null;
  if(id && S.chatId === id && chatTimer) return;
  if(chatTimer){ clearInterval(chatTimer); chatTimer = null; }
  S.chatId = id;
  if(id){
    chatTimer = setInterval(() => { if(!document.hidden) loadChat(id); }, 3000);
    const c = el("chatList"); if(c) c.scrollTop = c.scrollHeight;
  }
}

/* "12m left" counters tick without redrawing the page */
setInterval(() => {
  document.querySelectorAll("[data-until]").forEach(n => { n.textContent = leftStr(n.getAttribute("data-until")); });
}, 15000);

document.addEventListener("visibilitychange", () => { if(!document.hidden && S.me && !/^setup/.test(S.auth.step||"")) refresh(true); });

/* ============================================================
   START
   ============================================================ */
/* Visitor count for the admin dashboard: a random ID kept in this browser.
   No name, email or IP address is sent. */
function visitorId(){
  const k = "snappro.vid";
  try{
    let id = localStorage.getItem(k);
    if(!id || !/^[0-9a-f-]{36}$/i.test(id)){
      id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
         : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c === "x" ? r : (r&3|8)).toString(16); });
      localStorage.setItem(k, id);
    }
    return id;
  }catch(e){ return null; }
}
function trackVisit(){
  try{
    if(!sb) return;
    const id = visitorId(); if(!id) return;
    const ua = navigator.userAgent || "";
    const device = /iPad|Tablet/i.test(ua) ? "tablet" : /Mobi|Android|iPhone/i.test(ua) ? "mobile" : "desktop";
    let ref = null;
    try{ if(document.referrer){ const h = new URL(document.referrer).hostname; if(h && h !== location.hostname) ref = h.replace(/^www\./, ""); } }catch(e){}
    Promise.resolve(sb.rpc("track_visit", { p_visitor: id, p_path: location.pathname, p_referrer: ref, p_device: device })).catch(() => {});
  }catch(e){}
}

async function boot(){
  render();
  const ok = await ensureSb();
  S.booted = true;
  if(ok) trackVisit();
  if(!ok){ S.auth = { step: "welcome" }; render(); toast("Couldn't connect", "Check your internet and refresh the page", "x"); return; }
  let session = null;
  try{ const { data } = await sb.auth.getSession(); session = data && data.session; }catch(e){}
  if(session){ await afterAuth(false); }
  else { S.auth = { step: "welcome" }; render(); }
  sb.auth.onAuthStateChange(ev => {
    if(ev === "SIGNED_OUT" && S.me){
      stopPolling(); S.me = null; S.pg = null; S.stack = []; S.auth = { step: "login", email: "" };
      render(); toast("You've been logged out", "Please log in again", "logout");
    }
  });
}
if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();

</script>
